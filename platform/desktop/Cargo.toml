[package]
name = "lumo-desktop"
version = "0.1.0"
description = "Lumo local-first desktop workspace"
authors = ["Lumo"]
license = "Apache-2.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
