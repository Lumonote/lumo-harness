{{- if and .Values.deviceGateway.istioIngress.enabled (not .Values.deviceGateway.enabled) }}
{{- fail "deviceGateway.enabled must be true when deviceGateway.istioIngress.enabled=true" }}
{{- end }}
{{- if .Values.deviceGateway.enabled }}
{{- if not .Values.services.governance.enabled }}
{{- fail "services.governance.enabled must be true when deviceGateway.enabled=true" }}
{{- end }}
{{- $publicUrl := required "deviceGateway.publicUrl is required" .Values.deviceGateway.publicUrl }}
{{- $public := urlParse $publicUrl }}
{{- if or (ne $public.scheme "https") (empty $public.host) (not (empty $public.userinfo)) (not (empty $public.path)) (not (empty $public.query)) (not (empty $public.fragment)) }}
{{- fail "deviceGateway.publicUrl must be an exact HTTPS origin without credentials, path, query, or fragment" }}
{{- end }}
{{- if or (lt (int .Values.deviceGateway.port) 1) (gt (int .Values.deviceGateway.port) 65535) (eq (int .Values.deviceGateway.port) (int .Values.services.governance.port)) }}
{{- fail "deviceGateway.port must be a valid port distinct from services.governance.port" }}
{{- end }}
{{- if or (lt (int .Values.deviceGateway.service.port) 1) (gt (int .Values.deviceGateway.service.port) 65535) }}
{{- fail "deviceGateway.service.port must be a valid TCP port" }}
{{- end }}
{{- if not (has .Values.deviceGateway.service.type (list "ClusterIP" "NodePort" "LoadBalancer")) }}
{{- fail "deviceGateway.service.type must be ClusterIP, NodePort, or LoadBalancer" }}
{{- end }}
{{- if and .Values.deviceGateway.istioIngress.enabled (ne .Values.deviceGateway.service.type "ClusterIP") }}
{{- fail "deviceGateway.service.type must remain ClusterIP when deviceGateway.istioIngress.enabled=true" }}
{{- end }}
{{- if and (not .Values.services.registry.enabled) (empty .Values.deviceGateway.registryUrl) }}
{{- fail "deviceGateway.registryUrl is required when services.registry.enabled=false" }}
{{- end }}
{{- if and .Values.deviceGateway.processRuntime (empty .Values.deviceGateway.policyUrl) }}
{{- fail "deviceGateway.policyUrl is required when deviceGateway.processRuntime=true" }}
{{- end }}
{{- if and .Values.deviceGateway.istioIngress.enabled (not .Values.serviceMesh.istio.enabled) }}
{{- fail "serviceMesh.istio.enabled must be true when deviceGateway.istioIngress.enabled=true" }}
{{- end }}
{{- end }}
{{- range $name, $cfg := .Values.services }}
{{- if $cfg.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumo-platform.name" $ }}-{{ $name }}
  labels:
    lumo.dev/service: {{ $name }}
spec:
  {{- /* Per-service override, because the cluster shape is not uniform: the
         cluster topology runs scheduler and collaborator in pairs and the
         rest singly. A single global replicaCount cannot express that, and
         silently deploying one scheduler would leave the lease/standby path
         (the thing cluster acceptance exists to exercise) untested. */}}
  replicas: {{ default $.Values.replicaCount $cfg.replicas }}
  selector:
    matchLabels: { lumo.dev/service: {{ $name }} }
  template:
    metadata:
      labels:
        lumo.dev/service: {{ $name }}
        {{- if $.Values.serviceMesh.istio.enabled }}
        lumo.dev/mesh-mtls: "enabled"
        {{- if $.Values.serviceMesh.istio.revision }}
        istio.io/rev: {{ $.Values.serviceMesh.istio.revision | quote }}
        {{- end }}
        {{- end }}
      {{- if $.Values.serviceMesh.istio.enabled }}
      annotations:
        sidecar.istio.io/inject: "true"
        {{- if and (eq $name "governance") $.Values.deviceGateway.enabled }}
        traffic.sidecar.istio.io/excludeInboundPorts: {{ $.Values.deviceGateway.port | quote }}
        {{- end }}
      {{- end }}
    spec:
      {{- if and (eq $name "governance") $.Values.deviceGateway.enabled }}
      securityContext:
        fsGroup: 10001
      {{- end }}
      containers:
        - name: {{ $name }}
          {{- /* 控制面 12 个服务共用 `control-plane` 一个镜像（2026-09-20 合并），入口由
                 `command` 指定：镜像里装的是 12 个二进制，它的 ENTRYPOINT 是空的——没有
                 command 时 k8s 会以「no command specified」失败，而不是默默跑错服务。 */}}
          image: {{ $.Values.image.repository }}/control-plane:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["/usr/local/bin/{{ $name }}"]
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
            {{- if and (eq $name "governance") $.Values.deviceGateway.enabled }}
            - name: device-tls
              containerPort: {{ $.Values.deviceGateway.port }}
            {{- end }}
          envFrom:
            - configMapRef: { name: {{ include "lumo-platform.name" $ }}-config }
            {{- if and (eq $name "governance") $.Values.governance.authSecret }}
            - secretRef: { name: {{ $.Values.governance.authSecret | quote }}, optional: false }
            {{- end }}
          env:
            {{- if eq $name "scheduler" }}
            - name: LUMO_GOVERNANCE_URL
              value: {{ printf "http://%s-governance:%v" (include "lumo-platform.name" $) $.Values.services.governance.port | quote }}
            {{- /* 集群失联判定开关（cmd/scheduler 的 domain.ResolveClusterEnforcement）。
                   这个键由 values.cluster.yaml 打开；基础 values.yaml 保持关闭，避免
                   一次无关的 values 改动把生产上的准入闸门悄悄翻过来。 */}}
            - name: LUMO_CLUSTER_ENFORCE
              value: {{ $.Values.services.scheduler.clusterEnforce | default false | quote }}
            {{- /* 集群身份（本 release 服务哪个集群）。
                   它给**集群本地放置降级**用：全局调度选不出 leader 时，本集群的任务仍要能
                   落下去，而「本地」需要身份（见 internal/server 的 degradedPlacement）。
                   在这里与 dshNode.clusterId 同源派生，省掉一处会配错的地方。
                   基础 profile 下 dshNode 不开，这里也留空 = 不认领身份，行为完全不变。 */}}
            - name: LUMO_SCHEDULER_CLUSTER_ID
              value: {{ if $.Values.dshNode.enabled }}{{ $.Values.dshNode.clusterId | default "default" | quote }}{{ else }}""{{ end }}
            {{- /* 但**不自报**。这一段是原注释的推理，结论变了、理由没变：
                   「调度器还在跑」不等于「这个集群还能接放置」——把节点池缩到 0 时调度器
                   照旧活着，由它自报会让一个空集群一直显示健康，而放置落下去无人执行。
                   所以存活的上报方仍然是节点池（templates/dsh-node.yaml 带 LUMO_ROLE=node
                   与 LUMO_SCHEDULER_URL），调度器只判定 + 只做本地放置决策。

                   **两个开关的分离是必须的**：在 domain.ResolveClusterSelfReport 出现之前，
                   身份一设就自动自报，于是这里只能「两个都不要」——而那样连降级路径也一起
                   没了（那条判据的第一条就是「本实例有集群身份」）。一个开关承担两件事时，
                   配置的人只能撒一个谎。 */}}
            - name: LUMO_CLUSTER_SELF_REPORT
              value: "false"
            {{- /* 版本一致性前置（§7.4.1）：全局任务只落到「版本可证明一致」的集群上。
                   与存活闸门**独立**（可以只开一个），默认关——打开它会让「有人在滚动
                   升级」变成「全局任务排队」，那是发布流程的决策而不是正确性修复。
                   它的全部输入是承载节点声明的 LUMO_CLUSTER_VERSION；没人声明时判定为
                   「无信息一致」→ 恒放行，于是开关看起来生效了而作用为零。所以打开它
                   必须同时设 dshNode.clusterVersion，cluster-registry-check.py 有一条
                   静态规则专抓这个组合（闸门开 + 整个拓扑无人声明）。 */}}
            - name: LUMO_CLUSTER_VERSION_GATE
              value: {{ $.Values.services.scheduler.clusterVersionGate | default false | quote }}
            {{- /* 偏好打分的两项权重（§7.4.1 的 clusterTag/region 标签偏好）。默认值与
                   domain.DefaultPlacementWeights 一致；affinity/load 就是「亲和分最多
                   能翻转多少负载比差」这条不变量的边界值，启动日志里会打出来。 */}}
            - name: LUMO_PLACEMENT_LOAD_WEIGHT
              value: {{ $.Values.services.scheduler.placementLoadWeight | default 1 | quote }}
            - name: LUMO_PLACEMENT_AFFINITY_WEIGHT
              value: {{ $.Values.services.scheduler.placementAffinityWeight | default 0.25 | quote }}
            {{- end }}
            - name: LUMO_LISTEN
              value: {{ printf ":%v" $cfg.port | quote }}
            {{- /* 每个副本都要有唯一实例标识，且必须从 Pod 名注入。
                   scheduler 的实例名回落链是 LUMO_INSTANCE → 字面量 "scheduler-0"
                   （cmd/scheduler/main.go:33），不是主机名；缺了这个变量时两个副本
                   会以同一个 holder 去 Acquire，而 store.go:204-208 在 holder 相同时
                   **不递增 fencing_token** 且 WHERE 子句照样命中——两个进程各拿到
                   token=1 的租约，checkFencing 只比 holder+token，于是互相之间
                   完全没有 fencing，即双 leader。用 Pod 名还顺带让重启后的新进程
                   拿到更高的 token，把旧进程挡在外面。 */}}
            - name: LUMO_INSTANCE
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: LUMO_CONTROL_PLANE_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $.Values.controlPlaneAuth.tokenSecret }}, key: {{ $.Values.controlPlaneAuth.tokenKey }}, optional: false } }
            {{- /* 空名字必须整条省略。渲染成 `name: ` 会产出一份非法清单，而
                   `helm template` 不会报错——它只在 GitOps 同步或 kubectl apply
                   时才炸，报错位置离真正的原因很远。 */}}
            {{- if $.Values.vault.tokenSecret }}
            - name: LUMO_VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $.Values.vault.tokenSecret }}, key: {{ $.Values.vault.tokenKey }}, optional: true } }
            {{- end }}
            {{- if eq $name "governance" }}
            - name: LUMO_DESKTOP_GATEWAY_ENABLED
              value: {{ $.Values.deviceGateway.enabled | quote }}
            {{- if $.Values.deviceGateway.enabled }}
            - name: LUMO_DESKTOP_GATEWAY_LISTEN
              value: {{ printf ":%v" $.Values.deviceGateway.port | quote }}
            - name: LUMO_DESKTOP_GATEWAY_PUBLIC_URL
              value: {{ $.Values.deviceGateway.publicUrl | quote }}
            - name: LUMO_REGISTRY_URL
              value: {{ default (printf "http://%s-registry:%v" (include "lumo-platform.name" $) $.Values.services.registry.port) $.Values.deviceGateway.registryUrl | quote }}
            - name: LUMO_DESKTOP_GATEWAY_CERT_FILE
              value: /etc/lumo/device-server/server.crt
            - name: LUMO_DESKTOP_GATEWAY_KEY_FILE
              value: /etc/lumo/device-server/server.key
            - name: LUMO_DESKTOP_ISSUER_CERT_FILE
              value: /etc/lumo/device-issuer/issuer.crt
            - name: LUMO_DESKTOP_ISSUER_KEY_FILE
              value: /etc/lumo/device-issuer/issuer.key
            - name: LUMO_DESKTOP_ALLOWED_SCOPES
              value: {{ join "," $.Values.deviceGateway.allowedScopes | quote }}
            - name: LUMO_DESKTOP_PROCESS_RUNTIME
              value: {{ $.Values.deviceGateway.processRuntime | quote }}
            - name: LUMO_DESKTOP_POLICY_URL
              value: {{ $.Values.deviceGateway.policyUrl | quote }}
            {{- end }}
            {{- end }}
            {{- if eq $name "connector-gateway" }}
            - name: LUMO_ADMIN_ROLES
              value: {{ $.Values.connectorOAuth.adminRoles | quote }}
            {{- if $.Values.connectorOAuth.enabled }}
            - name: LUMO_CONNECTOR_OAUTH_ENABLED
              value: "true"
            - name: LUMO_CONNECTOR_OAUTH_CALLBACK_URL
              value: {{ required "connectorOAuth.callbackUrl is required" $.Values.connectorOAuth.callbackUrl | quote }}
            - name: LUMO_CONNECTOR_OAUTH_STATE_KEY
              valueFrom: { secretKeyRef: { name: {{ required "connectorOAuth.stateKeySecret is required" $.Values.connectorOAuth.stateKeySecret | quote }}, key: {{ $.Values.connectorOAuth.stateKeyKey | quote }}, optional: false } }
            - name: LUMO_CONNECTOR_OAUTH_VAULT_MOUNT
              value: {{ $.Values.connectorOAuth.vaultMount | quote }}
            - name: LUMO_CONNECTOR_OAUTH_VAULT_PREFIX
              value: {{ $.Values.connectorOAuth.vaultPrefix | quote }}
            {{- end }}
            {{- end }}
            {{- if eq $name "collaborator" }}
            - name: LUMO_NACOS_COLLABORATOR_SERVICE
              value: lumo-collaborator
            - name: LUMO_NODE_ADVERTISE_HOST
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: LUMO_NACOS_PORT
              value: {{ $cfg.port | quote }}
            {{- /* 已发布文档 → 知识库的投影下游。宿主就是节点池：它以 `role=node`
                   推导出 seam host 模式，Service 也把 seam 端口暴露出来，而 dsh-web
                   虽然也跑 host 模式，它的 Service 并不暴露那个端口。
                   地址从 chart 事实派生而不是写死：同一 namespace 里可以装两个 release
                   （`lumo` 与 `lumo-b`，见 edge-routes.yaml 的同一段理由），写死的
                   `<name>-dsh-node:8090` 会让第二个 release 把文档投影到**第一个**
                   release 的节点池里——两个集群都看起来在正常工作。
                   dshNode 关闭时整条省略：没有 seam host 就没有下游地址，让 collaborator
                   按「未配置」如实打 warn，而不是指向一个不存在的名字。 */}}
            {{- if $.Values.dshNode.enabled }}
            - name: LUMO_KNOWLEDGE_SEAM_URL
              value: {{ printf "http://%s-dsh-node:%v" (include "lumo-platform.name" $) $.Values.dshNode.seamPort | quote }}
            {{- end }}
            {{- if $.Values.dshNode.identityAssertion.secretName }}
            - name: LUMO_IDENTITY_ASSERTION_SECRET
              valueFrom: { secretKeyRef: { name: {{ $.Values.dshNode.identityAssertion.secretName }}, key: {{ $.Values.dshNode.identityAssertion.secretKey }}, optional: false } }
            {{- end }}
            {{- end }}
            {{- if eq $name "edge-gateway" }}
            {{- /* 这一条是 pod 级 env 覆盖 envFrom 同名键的用法，不是冗余：
                   共享 ConfigMap 给**每个**服务注入 `LUMO_CORS_ORIGIN`，而 gate.go:122-124
                   明确写着部署 edge-gateway 时不应设它 —— observability 中间件会按「配置的
                   来源」写死 ACAO，边缘层却要按「请求的 Origin」裁决，两套头叠在一个响应上
                   时行为取决于哪一层写在后面。空串让中间件整条跳过（它判 `!= ""`），
                   于是 gate.CORS 成为边缘 CORS 的唯一来源。 */}}
            - name: LUMO_CORS_ORIGIN
              value: ""
            - name: LUMO_EDGE_ROUTES
              value: /etc/lumo/edge-routes.json
            - name: LUMO_EDGE_REDIS_URL
              value: {{ default (printf "redis://%s" $.Values.redis.address) $.Values.edgeGateway.redisUrl | quote }}
            - name: LUMO_EDGE_LIMITER_FAIL_OPEN
              value: {{ $.Values.edgeGateway.limiterFailOpen | quote }}
            {{- /* `int` is load-bearing on the three numeric ones, not decoration.
                   Helm decodes values.yaml numbers as float64, and `quote` of a
                   float64 uses %v/%g — which switches to scientific notation at
                   1e6. The default maxBodyBytes (1048576) rendered as
                   "1.048576e+06", and the gateway parses that with
                   strconv.ParseInt: it fails, `envOrInt64` falls back to the
                   built-in default, and the value silently becomes 1<<20 anyway
                   **because the two happen to agree**. Set maxBodyBytes to
                   2000000 and the effective limit would stay 1 MiB with nothing
                   logged. Any future numeric env here needs the same cast. */}}
            - name: LUMO_EDGE_GLOBAL_RPM
              value: {{ int $.Values.edgeGateway.globalRpm | quote }}
            - name: LUMO_EDGE_MAX_BODY_BYTES
              value: {{ int $.Values.edgeGateway.maxBodyBytes | quote }}
            - name: LUMO_EDGE_MAX_CONNS
              value: {{ int $.Values.edgeGateway.maxConns | quote }}
            - name: LUMO_EDGE_CORS_ORIGINS
              value: {{ default $.Values.console.corsOrigin (join "," $.Values.edgeGateway.corsOrigins) | quote }}
            {{- end }}
            {{- if eq $name "terminal-gateway" }}
            {{- /* 签名密钥必须有：缺了它二进制不报错，而是把每个敏感动作 fail-closed 拒掉，
                   日志说「策略引擎/签名不可用」。那是安全的一侧，但症状与「权限不足」长得
                   像，所以宁可让它在渲染期就把名字要求出来（templates/secret.yaml 亦然）。 */}}
            - name: LUMO_TERMINAL_SIGNING_SECRET
              valueFrom: { secretKeyRef: { name: {{ required "terminalGateway.signingSecret must name a Secret holding the terminal action signing key (an empty value makes the terminal fail closed on every sensitive action)" $.Values.terminalGateway.signingSecret | quote }}, key: {{ $.Values.terminalGateway.signingKey | quote }}, optional: false } }
            - name: LUMO_PRESENCE_TTL
              value: {{ $.Values.terminalGateway.presenceTtl | quote }}
            {{- end }}
          {{- if eq $name "registry" }}
          volumeMounts:
            - name: registry-trust
              mountPath: /etc/lumo/trust
              readOnly: true
          {{- end }}
          {{- if and (eq $name "governance") $.Values.deviceGateway.enabled }}
          volumeMounts:
            - name: device-server
              mountPath: /etc/lumo/device-server
              readOnly: true
            - name: device-issuer
              mountPath: /etc/lumo/device-issuer
              readOnly: true
          {{- end }}
          {{- /* The three `volumeMounts:` blocks (registry / governance / edge-gateway) are
                 mutually exclusive because $name is a single value. They are written as
                 separate keys rather than one merged list, so if a fourth service ever needs
                 a mount, merging is a real edit — two `volumeMounts:` keys in one container
                 would be duplicate YAML keys, and the API server would silently keep the
                 last one. */}}
          {{- if eq $name "edge-gateway" }}
          volumeMounts:
            # Mounted as a directory, and deliberately **not** with subPath: a subPath
            # mount never receives ConfigMap updates, which would make the gateway's
            # SIGHUP reload path dead (it would re-read the same bytes the pod started
            # with) and turn every route-table edit into a restart. See
            # templates/edge-routes.yaml.
            - name: edge-routes
              mountPath: /etc/lumo
              readOnly: true
          {{- end }}
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      {{- if eq $name "registry" }}
      volumes:
        - name: registry-trust
          secret: { secretName: {{ $.Values.registry.trustSecret }}, optional: false }
      {{- end }}
      {{- if and (eq $name "governance") $.Values.deviceGateway.enabled }}
      volumes:
        - name: device-server
          secret:
            secretName: {{ required "deviceGateway.tlsSecret is required" $.Values.deviceGateway.tlsSecret | quote }}
            optional: false
            defaultMode: 0440
            items:
              - key: {{ required "deviceGateway.tlsCertKey is required" $.Values.deviceGateway.tlsCertKey | quote }}
                path: server.crt
              - key: {{ required "deviceGateway.tlsKeyKey is required" $.Values.deviceGateway.tlsKeyKey | quote }}
                path: server.key
            - name: device-issuer
              secret:
                secretName: {{ required "deviceGateway.issuerSecret is required" $.Values.deviceGateway.issuerSecret | quote }}
                optional: false
                defaultMode: 0440
                items:
                  - key: {{ required "deviceGateway.issuerCertKey is required" $.Values.deviceGateway.issuerCertKey | quote }}
                    path: issuer.crt
                  - key: {{ required "deviceGateway.issuerKeyKey is required" $.Values.deviceGateway.issuerKeyKey | quote }}
                    path: issuer.key
      {{- end }}
      {{- if eq $name "edge-gateway" }}
      volumes:
        - name: edge-routes
          configMap: { name: {{ include "lumo-platform.name" $ }}-edge-routes }
      {{- end }}
---
{{- end }}
{{- end }}
