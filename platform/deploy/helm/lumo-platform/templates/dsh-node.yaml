{{- if .Values.dshNode.enabled }}
apiVersion: apps/v1
kind: {{ .Values.dshNode.workloadKind }}
metadata:
  name: {{ include "lumo-platform.name" . }}-dsh-node
  labels:
    lumo.dev/service: dsh-node
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  {{- if eq .Values.dshNode.workloadKind "StatefulSet" }}
  serviceName: {{ include "lumo-platform.name" . }}-dsh-node
  {{- end }}
  {{- if not .Values.dshNode.hpa.enabled }}
  replicas: {{ .Values.dshNode.replicas }}
  {{- end }}
  selector:
    matchLabels: { lumo.dev/service: dsh-node, app.kubernetes.io/instance: {{ .Release.Name | quote }} }
  template:
    metadata:
      labels:
        lumo.dev/service: dsh-node
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        {{- if .Values.serviceMesh.istio.enabled }}
        lumo.dev/mesh-mtls: "enabled"
        {{- if .Values.serviceMesh.istio.revision }}
        istio.io/rev: {{ .Values.serviceMesh.istio.revision | quote }}
        {{- end }}
        {{- end }}
      {{- if .Values.serviceMesh.istio.enabled }}
      annotations:
        sidecar.istio.io/inject: "true"
      {{- end }}
    spec:
      {{- include "lumo-platform.topology" (dict "root" . "service" "dsh-node") | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.dshNode.terminationGracePeriodSeconds }}
      {{- if .Values.provisioner.enabled }}
      initContainers:
        - name: provisioner-bootstrap
          image: {{ .Values.provisioner.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: REGISTRY_URL
              value: {{ printf "http://%s-registry:%v" (include "lumo-platform.name" .) .Values.services.registry.port | quote }}
            - name: PROVISIONER_ARTIFACT_NAME
              value: {{ required "provisioner.artifactName is required when provisioner is enabled" .Values.provisioner.artifactName | quote }}
            {{- if .Values.provisioner.rolloutChannel }}
            - name: PROVISIONER_ROLLOUT_CHANNEL
              value: {{ .Values.provisioner.rolloutChannel | quote }}
            {{- else }}
            - name: PROVISIONER_ARTIFACT_VERSION
              value: {{ required "provisioner.artifactVersion is required when provisioner is enabled" .Values.provisioner.artifactVersion | quote }}
            {{- end }}
            - name: PROVISIONER_INTERVAL
              value: 0s
            - name: PROVISIONER_SHAPE
              value: {{ .Values.provisioner.shape | quote }}
            - name: PROVISIONER_INSTALL_DIR
              value: {{ .Values.provisioner.installDir | quote }}
            - name: PROVISIONER_NODE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: LUMO_CONTROL_PLANE_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.controlPlaneAuth.tokenSecret }}, key: {{ .Values.controlPlaneAuth.tokenKey }}, optional: false } }
          volumeMounts:
            - name: artifacts
              mountPath: {{ .Values.provisioner.installDir | quote }}
      {{- end }}
      containers:
        - name: dsh-node
          image: {{ .Values.dshNode.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: subagent, containerPort: {{ .Values.dshNode.port }} }
            - { name: seam, containerPort: {{ .Values.dshNode.seamPort }} }
          envFrom:
            - configMapRef: { name: {{ include "lumo-platform.name" . }}-config }
            {{- if .Values.dshNode.harness.credentialsSecret }}
            - secretRef: { name: {{ .Values.dshNode.harness.credentialsSecret | quote }}, optional: false }
            {{- end }}
          env:
            - name: DSH_HOME
              value: /root/.dsh
            - name: LUMO_SEAM_MODE
              value: host
            - name: LUMO_SEAM_BIND
              value: 0.0.0.0
            - name: LUMO_SEAM_PORT
              value: {{ .Values.dshNode.seamPort | quote }}
            {{- /* Seam host 的验签密钥。不设时节点回落到控制面令牌，而调用方
                   （collaborator 的知识库投影）走同一条回落，两侧不会分叉；
                   设了就必须两侧同值，模板已经从同一处取值。 */}}
            {{- if .Values.dshNode.identityAssertion.secretName }}
            - name: LUMO_IDENTITY_ASSERTION_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.dshNode.identityAssertion.secretName }}, key: {{ .Values.dshNode.identityAssertion.secretKey }}, optional: false } }
            {{- end }}
            - name: LUMO_NODE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            {{- if .Values.dshNode.threadExecution }}
            - name: LUMO_THREAD_EXECUTION
              value: {{ .Values.dshNode.threadExecution | toJson | quote }}
            {{- end }}
            - name: LUMO_NODE_ADVERTISE_HOST
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: LUMO_NODE_CAPACITY
              value: {{ .Values.dshNode.capacity | quote }}
            - name: LUMO_NODE_CAPABILITIES
              value: {{ .Values.dshNode.capabilities | quote }}
            - name: LUMO_NODE_RESIDENCY
              value: {{ .Values.dshNode.residency | quote }}
            - name: LUMO_CLUSTER_ID
              value: {{ .Values.dshNode.clusterId | quote }}
            {{- /* 版本一致性前置（§7.4.1）的声明方。与存活自报同理必须是**承载节点**：
                   它说的是「这个集群现在跑的是哪个版本」，而调度器自己的版本是另一条
                   发布线。留空 = 不声明（整条省略，不是渲染成空串——空串在服务端语义上
                   就是「没说」，但渲染出来会让读清单的人以为配了）。 */}}
            {{- if .Values.dshNode.clusterVersion }}
            - name: LUMO_CLUSTER_VERSION
              value: {{ .Values.dshNode.clusterVersion | quote }}
            {{- end }}
            - name: LUMO_REALM
              value: {{ .Values.dshNode.realm | quote }}
            - name: LUMO_ROLE
              value: node
            {{- if .Values.dshNode.governedWorker.enabled }}
            - name: LUMO_USER_ID
              value: {{ required "dshNode.governedWorker.ownerUserId is required" .Values.dshNode.governedWorker.ownerUserId | quote }}
            - name: LUMO_PROJECT_ID
              value: {{ required "dshNode.governedWorker.projectId is required" .Values.dshNode.governedWorker.projectId | quote }}
            - name: LUMO_AGENT_ID
              value: {{ required "dshNode.governedWorker.agentId is required" .Values.dshNode.governedWorker.agentId | quote }}
            - name: LUMO_AGENT_PRESET_REVISION
              value: {{ required "dshNode.governedWorker.presetRevision is required" .Values.dshNode.governedWorker.presetRevision | quote }}
            - name: LUMO_AGENT_PROVIDER
              value: {{ required "dshNode.governedWorker.provider is required" .Values.dshNode.governedWorker.provider | quote }}
            - name: LUMO_AGENT_MODEL
              value: {{ required "dshNode.governedWorker.model is required" .Values.dshNode.governedWorker.model | quote }}
            {{- if .Values.dshNode.governedWorker.promptRef }}
            - name: LUMO_AGENT_SYSTEM_PROMPT_REF
              value: {{ .Values.dshNode.governedWorker.promptRef | quote }}
            - name: LUMO_AGENT_SYSTEM_PROMPT_FILE
              value: /run/lumo/prompt/system-prompt.txt
            {{- end }}
            {{- end }}
            - name: LUMO_SUBAGENT_HOST_BIND
              value: 0.0.0.0
            - name: LUMO_SUBAGENT_HOST_PORT
              value: {{ .Values.dshNode.port | quote }}
            - name: LUMO_SUBAGENT_CALLBACK_ALLOWED_ORIGINS
              value: {{ printf "http://%s-dsh-web:%v" (include "lumo-platform.name" .) .Values.dshWeb.callbackPort | quote }}
            {{- if .Values.objectStore.enabled }}
            - name: LUMO_MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ required "objectStore.credentialsSecret is required" .Values.objectStore.credentialsSecret | quote }}, key: accessKey, optional: false } }
            - name: LUMO_MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.objectStore.credentialsSecret | quote }}, key: secretKey, optional: false } }
            {{- end }}
            - name: LUMO_PG_DSN
              {{- if .Values.production.enabled }}
              valueFrom: { secretKeyRef: { name: {{ .Values.production.databaseSecret | quote }}, key: LUMO_PG_DSN, optional: false } }
              {{- else }}
              value: {{ .Values.postgres.dsn | quote }}
              {{- end }}
            {{- if .Values.dshNode.spool.persistence.enabled }}
            - name: LUMO_SESSION_LOG_SPOOL_DIR
              value: /var/lib/lumo/session-spool
            {{- end }}
            - name: LUMO_REDIS_URL
              value: {{ printf "redis://%s" .Values.redis.address | quote }}
            {{- if .Values.services.collaborator.enabled }}
            - name: LUMO_COLLABORATOR_URL
              value: {{ printf "http://%s-collaborator:%v" (include "lumo-platform.name" .) .Values.services.collaborator.port | quote }}
            {{- end }}
            - name: LUMO_NACOS_ADDR
              value: {{ .Values.nacos.address | quote }}
            - name: LUMO_NACOS_SERVICE
              value: {{ .Values.nacos.service | quote }}
            - name: LUMO_NACOS_GROUP
              value: {{ .Values.nacos.group | quote }}
            - name: LUMO_SCHEDULER_URL
              value: {{ printf "http://%s-scheduler:%v" (include "lumo-platform.name" .) .Values.services.scheduler.port | quote }}
            # §8.4 共享执行控制（C5）的提交入口。键名带连字符，所以**不能**写
            # `.Values.services.session-control.port` —— Go template 会把 `-` 当减法。
            # 那是渲染期错误而不是静默空值，但仍然必须走 `index`。
            # 对应断言见 deploy/helm-verify.sh 的 "points both dsh workloads"。
            - name: LUMO_SESSION_CONTROL_URL
              value: {{ printf "http://%s-session-control:%v" (include "lumo-platform.name" .) (index .Values.services "session-control").port | quote }}
            - name: LUMO_SUBAGENT_HOST_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.dshNode.hostTokenSecret }}, key: {{ .Values.dshNode.hostTokenKey }}, optional: false } }
            - name: LUMO_CONTROL_PLANE_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.controlPlaneAuth.tokenSecret }}, key: {{ .Values.controlPlaneAuth.tokenKey }}, optional: false } }
            {{- if .Values.provisioner.enabled }}
            - name: LUMO_SKILL_SNAPSHOT_ROOT
              value: {{ printf "%s/skills" .Values.provisioner.installDir | quote }}
            - name: LUMO_SKILL_SNAPSHOT_FILE
              value: {{ printf "%s/skill-snapshot.json" .Values.provisioner.installDir | quote }}
            {{- end }}
          volumeMounts:
            - name: harness-home
              mountPath: /root/.dsh
            {{- if .Values.dshNode.harness.patchConfigMap }}
            - name: harness-config
              mountPath: /root/.dsh/cordis.patch.yml
              subPath: cordis.patch.yml
              readOnly: true
            {{- end }}
          {{- if .Values.dshNode.spool.persistence.enabled }}
            - name: session-spool
              mountPath: /var/lib/lumo/session-spool
          {{- end }}
          {{- if .Values.provisioner.enabled }}
            - name: artifacts
              mountPath: {{ .Values.provisioner.installDir | quote }}
              readOnly: true
          {{- end }}
          {{- if and .Values.dshNode.governedWorker.enabled .Values.dshNode.governedWorker.promptRef }}
            - name: governed-prompt
              mountPath: /run/lumo/prompt/system-prompt.txt
              subPath: system-prompt.txt
              readOnly: true
          {{- end }}
          readinessProbe: { httpGet: { path: /readyz, port: subagent }, initialDelaySeconds: 8, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: subagent }, initialDelaySeconds: 20, periodSeconds: 20 }
          lifecycle:
            preStop:
              exec:
                command:
                  - node
                  - --input-type=module
                  - -e
                  - |
                    const timeout = {{ int .Values.dshNode.drainTimeoutSeconds }} * 1000;
                    const response = await fetch('http://127.0.0.1:{{ .Values.dshNode.port }}/drain', {
                      method: 'POST', signal: AbortSignal.timeout(timeout + 5000),
                      headers: { 'content-type': 'application/json', 'X-Lumo-Realm': process.env.LUMO_REALM,
                        'X-Lumo-Seam-Token': process.env.LUMO_SUBAGENT_HOST_TOKEN },
                      body: JSON.stringify({ timeout_ms: timeout }),
                    });
                    if (!response.ok) throw new Error('node drain failed: ' + response.status);

          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 2, memory: 2Gi }
      {{- if .Values.provisioner.enabled }}
        - name: provisioner
          image: {{ .Values.provisioner.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: REGISTRY_URL
              value: {{ printf "http://%s-registry:%v" (include "lumo-platform.name" .) .Values.services.registry.port | quote }}
            - name: PROVISIONER_ARTIFACT_NAME
              value: {{ required "provisioner.artifactName is required when provisioner is enabled" .Values.provisioner.artifactName | quote }}
            {{- if .Values.provisioner.rolloutChannel }}
            - name: PROVISIONER_ROLLOUT_CHANNEL
              value: {{ .Values.provisioner.rolloutChannel | quote }}
            {{- else }}
            - name: PROVISIONER_ARTIFACT_VERSION
              value: {{ required "provisioner.artifactVersion is required when provisioner is enabled" .Values.provisioner.artifactVersion | quote }}
            {{- end }}
            - name: PROVISIONER_INTERVAL
              value: {{ .Values.provisioner.interval | quote }}
            - name: PROVISIONER_SHAPE
              value: {{ .Values.provisioner.shape | quote }}
            - name: PROVISIONER_INSTALL_DIR
              value: {{ .Values.provisioner.installDir | quote }}
            - name: PROVISIONER_NODE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: LUMO_CONTROL_PLANE_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.controlPlaneAuth.tokenSecret }}, key: {{ .Values.controlPlaneAuth.tokenKey }}, optional: false } }
          volumeMounts:
            - name: artifacts
              mountPath: {{ .Values.provisioner.installDir | quote }}
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      {{- if .Values.provisioner.runtime.enabled }}
        - name: artifact-runtime
          image: {{ .Values.provisioner.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["artifact-runtime"]
          args: ["serve", "-dir", {{ .Values.provisioner.installDir | quote }}, "-socket", {{ .Values.provisioner.runtime.socketPath | quote }}]
          volumeMounts:
            - name: artifacts
              mountPath: {{ .Values.provisioner.installDir | quote }}
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      {{- end }}
      {{- end }}
      {{- if or (not .Values.dshNode.harness.persistence.enabled) .Values.dshNode.harness.patchConfigMap .Values.provisioner.enabled (and .Values.dshNode.governedWorker.enabled .Values.dshNode.governedWorker.promptRef) }}
      volumes:
      {{- if not .Values.dshNode.harness.persistence.enabled }}
        - name: harness-home
          emptyDir: {}
      {{- end }}
      {{- if .Values.dshNode.harness.patchConfigMap }}
        - name: harness-config
          configMap:
            name: {{ .Values.dshNode.harness.patchConfigMap | quote }}
            items:
              - key: {{ required "dshNode.harness.patchKey is required" .Values.dshNode.harness.patchKey | quote }}
                path: cordis.patch.yml
      {{- end }}
      {{- if .Values.provisioner.enabled }}
        - name: artifacts
          emptyDir: {}
      {{- end }}
      {{- if and .Values.dshNode.governedWorker.enabled .Values.dshNode.governedWorker.promptRef }}
        - name: governed-prompt
          secret:
            secretName: {{ required "dshNode.governedWorker.promptSecret is required" .Values.dshNode.governedWorker.promptSecret | quote }}
            items:
              - key: {{ required "dshNode.governedWorker.promptSecretKey is required" .Values.dshNode.governedWorker.promptSecretKey | quote }}
                path: system-prompt.txt
      {{- end }}
      {{- end }}
  {{- if or .Values.dshNode.spool.persistence.enabled .Values.dshNode.harness.persistence.enabled }}
  volumeClaimTemplates:
  {{- if .Values.dshNode.spool.persistence.enabled }}
    - metadata: { name: session-spool }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.dshNode.spool.persistence.storageClass }}
        storageClassName: {{ .Values.dshNode.spool.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.dshNode.spool.persistence.size }} }
  {{- end }}
  {{- if .Values.dshNode.harness.persistence.enabled }}
    - metadata: { name: harness-home }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.dshNode.harness.persistence.storageClass }}
        storageClassName: {{ .Values.dshNode.harness.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.dshNode.harness.persistence.size }} }
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lumo-platform.name" . }}-dsh-node
  labels:
    lumo.dev/service: dsh-node
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  clusterIP: None
  selector: { lumo.dev/service: dsh-node, app.kubernetes.io/instance: {{ .Release.Name | quote }} }
  ports:
    - { name: subagent, port: {{ .Values.dshNode.port }}, targetPort: subagent }
    - { name: seam, port: {{ .Values.dshNode.seamPort }}, targetPort: seam }
{{- if .Values.dshNode.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lumo-platform.name" . }}-dsh-node
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ .Values.dshNode.workloadKind }}
    name: {{ include "lumo-platform.name" . }}-dsh-node
  minReplicas: {{ .Values.dshNode.hpa.minReplicas }}
  maxReplicas: {{ .Values.dshNode.hpa.maxReplicas }}
  behavior:
    scaleUp: { stabilizationWindowSeconds: 0 }
    scaleDown: { stabilizationWindowSeconds: 300 }
  metrics:
    {{- if gt (int .Values.dshNode.hpa.targetCPUUtilizationPercentage) 0 }}
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.dshNode.hpa.targetCPUUtilizationPercentage }} }
    {{- end }}
    {{- range .Values.dshNode.hpa.externalMetrics }}
    - type: External
      external:
        metric:
          name: {{ required "external HPA metric name is required" .name | quote }}
          selector:
            matchLabels:
              release: {{ $.Release.Name | quote }}
              cluster_id: {{ $.Values.dshNode.clusterId | quote }}
              {{- with .matchLabels }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
        target:
          type: AverageValue
          averageValue: {{ required "external HPA metric averageValue is required" .averageValue | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- if .Values.dshWeb.enabled }}
{{- with .Values.dshWeb.userSessionExecution.migration }}
{{- $session := $.Values.dshWeb.userSessionExecution }}
{{- $routing := $session.routing | default dict }}
{{- if or (lt (int $.Values.dshWeb.replicas) 2) (lt (len ($routing.routes | default dict)) 2) (not $routing.nodeIdFromEnvironment) (ne $.Values.dshWeb.workloadKind "StatefulSet") (not $.Values.dshWeb.spool.persistence.enabled) (not $.Values.dshWeb.harness.persistence.enabled) }}
{{- fail "Session migration requires at least two stable StatefulSet nodes with distinct trusted routes and independent persistent spool/home volumes" }}
{{- end }}
{{- if or $session.connectors (not $.Values.objectStore.enabled) (not (index $.Values.services "session-control").enabled) (not $.Values.services.governance.enabled) }}
{{- fail "Session migration requires shared objectStore, session-control, Governance and a Session profile without connectors" }}
{{- end }}
{{- if or (not (regexMatch "^/var/lib/lumo/session-spool/[^/]+(/[^/]+)*$" $session.workspaceRoot)) (regexMatch "(^|/)\\.{1,2}(/|$)" $session.workspaceRoot) }}
{{- fail "Session migration workspaceRoot must be a dedicated directory inside the persistent /var/lib/lumo/session-spool volume" }}
{{- end }}
{{- end }}
{{- if and .Values.dshWeb.userSessionExecution (ne (int .Values.dshWeb.replicas) 1) }}
{{- $routing := .Values.dshWeb.userSessionExecution.routing | default dict }}
{{- if or (not $routing.nodeIdFromEnvironment) (ne .Values.dshWeb.workloadKind "StatefulSet") (not .Values.dshWeb.spool.persistence.enabled) (not .Values.dshWeb.harness.persistence.enabled) }}
{{- fail "multiple dynamic Session Web replicas require StatefulSet, unique environment node identities, persistent spool/home and explicit trusted routing" }}
{{- end }}
{{- $origins := dict }}
{{- range $ordinal := until (int .Values.dshWeb.replicas) }}
{{- $node := printf "%s-dsh-web-%d" (include "lumo-platform.name" $) $ordinal }}
{{- $origin := index ($routing.routes | default dict) $node }}
{{- if or (not $origin) (hasKey $origins $origin) }}
{{- fail "dynamic Session routing must pin a distinct trusted origin for every StatefulSet node" }}
{{- end }}
{{- $_ := set $origins $origin true }}
{{- end }}
{{- end }}
{{- with .Values.dshWeb.userSessionExecution.routing }}
{{- if and (eq .transportSecurity "mesh-mtls") (not $.Values.serviceMesh.istio.enabled) }}
{{- fail "dynamic Session mesh-mtls routing requires the configured service mesh" }}
{{- end }}
{{- if and $.Values.productionControls.enforced (eq .transportSecurity "development") }}
{{- fail "production dynamic Session routes require TLS or mesh mTLS" }}
{{- end }}
{{- end }}
{{- with .Values.dshWeb.userSessionExecution.knowledge }}
{{- if ne .realm $.Values.dshWeb.realm }}
{{- fail "dshWeb.userSessionExecution.knowledge.realm must match dshWeb.realm" }}
{{- end }}
{{- end }}
{{- with .Values.dshWeb.userSessionExecution.attachments }}
{{- if ne .realm $.Values.dshWeb.realm }}
{{- fail "dshWeb.userSessionExecution.attachments.realm must match dshWeb.realm" }}
{{- end }}
{{- end }}
{{- with .Values.dshWeb.userSessionExecution.connectors }}
{{- if ne .realm $.Values.dshWeb.realm }}
{{- fail "dshWeb.userSessionExecution.connectors.realm must match dshWeb.realm" }}
{{- end }}
{{- if not $.Values.ownedSessionConnectors }}
{{- fail "dshWeb.userSessionExecution.connectors requires ownedSessionConnectors" }}
{{- end }}
{{- if not (index $.Values.services "connector-gateway").enabled }}
{{- fail "dshWeb.userSessionExecution.connectors requires services.connector-gateway.enabled" }}
{{- end }}
{{- $realm := .realm }}
{{- $project := $.Values.dshWeb.userSessionExecution.projectId }}
{{- range .actions }}
{{- $connector := .connectorId }}
{{- range .operations }}
{{- $operation := . }}
{{- $granted := false }}
{{- range $.Values.ownedSessionConnectors }}
{{- if and (eq .realm $realm) (eq .project_id $project) (eq .connector_id $connector) (eq .operation $operation) }}
{{- $granted = true }}
{{- end }}
{{- end }}
{{- if not $granted }}
{{- fail "every dshWeb connector action requires an exact realm/project/connector/operation ownedSessionConnectors grant" }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if and (not .Values.dshWeb.identityAssertion.secretName) (not .Values.dshWeb.identityAssertion.allowStaticIdentity) }}
{{- fail "dshWeb.identityAssertion.secretName is required when dshWeb is enabled; set allowStaticIdentity=true only for development" }}
{{- end }}
---
apiVersion: apps/v1
kind: {{ .Values.dshWeb.workloadKind }}
metadata:
  name: {{ include "lumo-platform.name" . }}-dsh-web
  labels:
    lumo.dev/service: dsh-web
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  {{- if eq .Values.dshWeb.workloadKind "StatefulSet" }}
  serviceName: {{ include "lumo-platform.name" . }}-dsh-web-headless
  {{- end }}
  replicas: {{ .Values.dshWeb.replicas }}
  selector:
    matchLabels: { lumo.dev/service: dsh-web, app.kubernetes.io/instance: {{ .Release.Name | quote }} }
  template:
    metadata:
      labels:
        lumo.dev/service: dsh-web
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        {{- if .Values.serviceMesh.istio.enabled }}
        lumo.dev/mesh-mtls: "enabled"
        {{- if .Values.serviceMesh.istio.revision }}
        istio.io/rev: {{ .Values.serviceMesh.istio.revision | quote }}
        {{- end }}
        {{- end }}
      {{- if .Values.serviceMesh.istio.enabled }}
      annotations:
        sidecar.istio.io/inject: "true"
      {{- end }}
    spec:
      {{- include "lumo-platform.topology" (dict "root" . "service" "dsh-web") | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.dshWeb.terminationGracePeriodSeconds }}
      containers:
        - name: dsh-web
          image: {{ .Values.dshWeb.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef: { name: {{ include "lumo-platform.name" . }}-config }
            {{- if .Values.dshWeb.harness.credentialsSecret }}
            - secretRef: { name: {{ .Values.dshWeb.harness.credentialsSecret | quote }}, optional: false }
            {{- end }}
          ports:
            - { name: web, containerPort: {{ .Values.dshWeb.port }} }
            - { name: subagent-callback, containerPort: {{ .Values.dshWeb.callbackPort }} }
          env:
            - name: DSH_HOME
              value: /root/.dsh
            - name: LUMO_SEAM_MODE
              value: host
            - name: LUMO_DSH_PROFILE
              value: web
            - name: LUMO_DEPLOYMENT_MODE
              value: cluster
            - name: LUMO_CLUSTER_STATUS
              value: ready
            - name: LUMO_GOVERNANCE_URL
              value: {{ .Values.dshWeb.governanceUrl | quote }}
            - name: LUMO_AUTH_PUBLIC_URL
              value: {{ .Values.dshWeb.publicUrl | quote }}
            - name: LUMO_AUTH_SECURE_COOKIE
              value: {{ .Values.dshWeb.secureCookie | quote }}
            - name: LUMO_AUTH_PORT
              value: {{ .Values.dshWeb.port | quote }}
            {{- if .Values.dshWeb.userSessionExecution }}
            - name: LUMO_USER_SESSION_EXECUTION
              value: {{ .Values.dshWeb.userSessionExecution | toJson | quote }}
            {{- end }}
            {{- if .Values.dshWeb.threadExecution }}
            - name: LUMO_THREAD_EXECUTION
              value: {{ .Values.dshWeb.threadExecution | toJson | quote }}
            {{- end }}
            - name: LUMO_WEB_PORT
              value: {{ .Values.dshWeb.port | quote }}
            - name: LUMO_NODE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: LUMO_CLUSTER_ID
              value: {{ .Values.dshWeb.clusterId | quote }}
            - name: LUMO_REALM
              value: {{ .Values.dshWeb.realm | quote }}
            - name: LUMO_ROLE
              value: agent
            - name: LUMO_USER_ID
              value: {{ .Values.dshWeb.userId | quote }}
            - name: LUMO_USER_ROLE
              value: {{ .Values.dshWeb.userRole | quote }}
            - name: LUMO_PROJECT_ID
              value: {{ .Values.dshWeb.projectId | quote }}
            - name: LUMO_DEPT_ID
              value: {{ .Values.dshWeb.deptId | quote }}
            - name: LUMO_CONTROL_PLANE_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.controlPlaneAuth.tokenSecret }}, key: {{ .Values.controlPlaneAuth.tokenKey }}, optional: false } }
            {{- if .Values.dshWeb.identityAssertion.secretName }}
            - name: LUMO_IDENTITY_ASSERTION_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.dshWeb.identityAssertion.secretName }}, key: {{ .Values.dshWeb.identityAssertion.secretKey }}, optional: false } }
            {{- end }}
            {{- if .Values.objectStore.enabled }}
            - name: LUMO_MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ required "objectStore.credentialsSecret is required" .Values.objectStore.credentialsSecret | quote }}, key: accessKey, optional: false } }
            - name: LUMO_MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.objectStore.credentialsSecret | quote }}, key: secretKey, optional: false } }
            {{- end }}
            - name: LUMO_PG_DSN
              {{- if .Values.production.enabled }}
              valueFrom: { secretKeyRef: { name: {{ .Values.production.databaseSecret | quote }}, key: LUMO_PG_DSN, optional: false } }
              {{- else }}
              value: {{ .Values.postgres.dsn | quote }}
              {{- end }}
            {{- if .Values.dshWeb.spool.persistence.enabled }}
            - name: LUMO_SESSION_LOG_SPOOL_DIR
              value: /var/lib/lumo/session-spool
            {{- end }}
            - name: LUMO_REDIS_URL
              value: {{ printf "redis://%s" .Values.redis.address | quote }}
            - name: LUMO_SCHEDULER_URL
              value: {{ .Values.dshWeb.schedulerUrl | quote }}
            - name: LUMO_SCHEDULER_API_URL
              value: {{ .Values.dshWeb.schedulerUrl | quote }}
            # §8.4 共享执行控制（C5）的提交入口。dsh-web 是控制台后端，它的
            # `ctx.sessionControl.dispatch` 把控制指令 POST 到这里；没有它，
            # 控制台点了按钮只会拿到 ControlCommandRoutingError。
            - name: LUMO_SESSION_CONTROL_URL
              value: {{ .Values.dshWeb.sessionControlUrl | quote }}
            - name: LUMO_PROJECTS_URL
              value: {{ .Values.dshWeb.projectsUrl | quote }}
            - name: LUMO_FLOWS_URL
              value: {{ .Values.dshWeb.flowsUrl | quote }}
            - name: LUMO_CONNECTOR_GATEWAY_URL
              value: {{ .Values.dshWeb.connectorUrl | quote }}
            - name: LUMO_REGISTRY_URL
              value: {{ .Values.dshWeb.registryUrl | quote }}
            - name: LUMO_LLM_GATEWAY_URL
              value: {{ .Values.dshWeb.llmGatewayUrl | quote }}
            - name: LUMO_USAGE_LEDGER_URL
              value: {{ .Values.dshWeb.usageLedgerUrl | quote }}
            - name: LUMO_EDGE_GATEWAY_URL
              value: {{ .Values.dshWeb.edgeGatewayUrl | quote }}
            - name: LUMO_TERMINAL_GATEWAY_URL
              value: {{ .Values.dshWeb.terminalGatewayUrl | quote }}
            {{- if .Values.services.collaborator.enabled }}
            - name: LUMO_COLLABORATOR_URL
              value: {{ printf "http://%s-collaborator:%v" (include "lumo-platform.name" .) .Values.services.collaborator.port | quote }}
            {{- end }}
            - name: LUMO_NACOS_ADDR
              value: {{ .Values.dshWeb.nacosAddress | quote }}
            - name: LUMO_NACOS_SERVICE
              value: {{ .Values.dshWeb.nacosService | quote }}
            - name: LUMO_NACOS_GROUP
              value: {{ .Values.dshWeb.nacosGroup | quote }}
            - name: LUMO_SUBAGENT_CALLBACK_BIND_HOST
              value: 0.0.0.0
            - name: LUMO_SUBAGENT_CALLBACK_HOST
              value: {{ include "lumo-platform.name" . }}-dsh-web
            - name: LUMO_SUBAGENT_CALLBACK_PORT
              value: {{ .Values.dshWeb.callbackPort | quote }}
            - name: LUMO_SUBAGENT_HOST_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.dshNode.hostTokenSecret }}, key: {{ .Values.dshNode.hostTokenKey }}, optional: false } }
          volumeMounts:
            - name: harness-home
              mountPath: /root/.dsh
            {{- if .Values.dshWeb.harness.patchConfigMap }}
            - name: harness-config
              mountPath: /root/.dsh/cordis.patch.yml
              subPath: cordis.patch.yml
              readOnly: true
            {{- end }}
          {{- if .Values.dshWeb.spool.persistence.enabled }}
            - name: session-spool
              mountPath: /var/lib/lumo/session-spool
          {{- end }}
          readinessProbe: { httpGet: { path: /, port: web }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: web }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 2, memory: 2Gi }
      {{- if or (not .Values.dshWeb.harness.persistence.enabled) .Values.dshWeb.harness.patchConfigMap }}
      volumes:
      {{- if not .Values.dshWeb.harness.persistence.enabled }}
        - name: harness-home
          emptyDir: {}
      {{- end }}
      {{- if .Values.dshWeb.harness.patchConfigMap }}
        - name: harness-config
          configMap:
            name: {{ .Values.dshWeb.harness.patchConfigMap | quote }}
            items:
              - key: {{ required "dshWeb.harness.patchKey is required" .Values.dshWeb.harness.patchKey | quote }}
                path: cordis.patch.yml
      {{- end }}
      {{- end }}
  {{- if or .Values.dshWeb.spool.persistence.enabled .Values.dshWeb.harness.persistence.enabled }}
  volumeClaimTemplates:
  {{- if .Values.dshWeb.spool.persistence.enabled }}
    - metadata: { name: session-spool }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.dshWeb.spool.persistence.storageClass }}
        storageClassName: {{ .Values.dshWeb.spool.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.dshWeb.spool.persistence.size }} }
  {{- end }}
  {{- if .Values.dshWeb.harness.persistence.enabled }}
    - metadata: { name: harness-home }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.dshWeb.harness.persistence.storageClass }}
        storageClassName: {{ .Values.dshWeb.harness.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.dshWeb.harness.persistence.size }} }
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lumo-platform.name" . }}-dsh-web
  labels:
    lumo.dev/service: dsh-web
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  type: {{ .Values.service.type }}
  selector: { lumo.dev/service: dsh-web, app.kubernetes.io/instance: {{ .Release.Name | quote }} }
  ports:
    - { name: web, port: {{ .Values.dshWeb.port }}, targetPort: web }
    - { name: subagent-callback, port: {{ .Values.dshWeb.callbackPort }}, targetPort: subagent-callback }
{{- end }}

{{- if and .Values.dshWeb.enabled (eq .Values.dshWeb.workloadKind "StatefulSet") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lumo-platform.name" . }}-dsh-web-headless
spec:
  clusterIP: None
  selector: { lumo.dev/service: dsh-web, app.kubernetes.io/instance: {{ .Release.Name | quote }} }
  ports:
    - { name: web, port: {{ .Values.dshWeb.port }}, targetPort: web }
{{- end }}
