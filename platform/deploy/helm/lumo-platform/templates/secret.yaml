{{- /*
Shared Secrets this chart references.

The chart has always *referenced* four Secrets and never created any, which
left two problems that are easy to confuse:

  1. The default render is not installable. `lumo-control-plane-token` is read
     with `optional: false` by every enabled control-plane service, so a fresh
     `helm install` leaves every pod in CreateContainerConfigError until the
     operator guesses the right Secret names *and* key names from the
     templates.
  2. Nothing documented the key names. `registry-trust.json` in particular is
     a key that cannot be inferred from `registry.trustSecret`, and a Secret
     mounted as a volume with the wrong key silently mounts an empty
     directory.

`secrets.create` closes (1) for local and staging clusters. It is opt-in
because a chart that mints production credentials by default stores them in
the Helm release object (readable by anyone with `helm get manifest`) and
never rotates them; the production path stays "bring your own Secret".

The split between what is generated and what is not is deliberate:

  generated   lumo-control-plane-token   pure random bearer, no external
              lumo-subagent-host-token   counterpart that must agree
              lumo-terminal-signing      an HMAC key both sides of a signature
                                         check must agree on: any value works,
                                         so it can be minted -- but it must not
                                         change under the operator's feet, which
                                         is why it goes through the same
                                         lookup-and-reuse helper as the bearers
  generated   lumo-registry-trust        a *placeholder* trust anchor with an
                                         empty publisher list -- readable so
                                         the Registry starts, and fail-closed
                                         on use
  not         lumo-vault-token           a token the chart cannot mint because
                                         it must match a real Vault server
                                         this chart does not deploy

No plaintext value is accepted from values.yaml, and that is a property worth
keeping: `helm get values` and the release Secret are both readable by anyone
who can read the release, so a token that arrives through values has already
leaked. Set secrets.create=false and create the Secret yourself if you need to
choose the value.
*/ -}}
{{- $anyService := false -}}
{{- range $name, $cfg := .Values.services -}}
{{- if $cfg.enabled -}}{{- $anyService = true -}}{{- end -}}
{{- end -}}
{{- if and $anyService (not .Values.controlPlaneAuth.tokenSecret) -}}
{{- fail "controlPlaneAuth.tokenSecret must name a Secret: every enabled control-plane service reads LUMO_CONTROL_PLANE_TOKEN from it. Set secrets.create=true to have the chart create it, or create the Secret yourself and point this at it." -}}
{{- end -}}
{{- if and .Values.services.registry.enabled (not .Values.registry.trustSecret) -}}
{{- fail "registry.trustSecret must name a Secret holding the registry trust anchor under the key \"registry-trust.json\". Set services.registry.enabled=false to deploy without a Registry, or set secrets.create=true for a placeholder trust anchor." -}}
{{- end -}}
{{- if and (or .Values.dshNode.enabled .Values.dshWeb.enabled) (not .Values.dshNode.hostTokenSecret) -}}
{{- fail "dshNode.hostTokenSecret must name a Secret holding the subagent host bearer token: dsh-node and dsh-web both read LUMO_SUBAGENT_HOST_TOKEN from it. Set secrets.create=true to have the chart create it." -}}
{{- end -}}
{{- /* `index` rather than `.Values.services.terminal-gateway`: Go templates read the
       hyphen as subtraction (`terminal - gateway`) and fail with "bad character
       U+002D" — a parse error naming a column, not the key. Every hyphenated key
       in this chart (connector-gateway, llm-gateway, session-control, usage-ledger)
       needs this form, which is also why the trap stayed hidden: no template had
       ever named one before the gateways were added. The `| default dict` guard
       keeps a values overlay that deletes the key from exploding on `.enabled`. */}}
{{- $terminalGateway := index .Values.services "terminal-gateway" | default dict -}}
{{- if and $terminalGateway.enabled (not .Values.terminalGateway.signingSecret) -}}
{{- fail "terminalGateway.signingSecret must name a Secret holding the terminal action signing key: terminal-gateway reads LUMO_TERMINAL_SIGNING_SECRET from it, and an empty value makes it fail closed on every sensitive action (a safe failure, but the logs read like a permissions problem). Set secrets.create=true to have the chart create it, or point this at your own Secret." -}}
{{- end -}}
{{- if .Values.secrets.create }}
{{- $ns := .Release.Namespace }}
{{- $labels := include "lumo-platform.labels" . }}
{{- if $anyService }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.controlPlaneAuth.tokenSecret | quote }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    # Keep credentials out of the delete path: a token that external callers
    # have already been configured with must not disappear because someone
    # uninstalled the release. Re-installing with the same release name adopts
    # this object, and the lookup in the helper reuses the same value.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.controlPlaneAuth.tokenKey | quote }}: {{ include "lumo-platform.managedSecretValue" (dict "namespace" $ns "name" .Values.controlPlaneAuth.tokenSecret "key" .Values.controlPlaneAuth.tokenKey "length" 48) }}
{{- end }}
{{- if .Values.services.registry.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registry.trustSecret | quote }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # {"publishers":[]} trusts nothing, which is the correct placeholder: the
  # Registry starts, and every artifact verification fails closed until a real
  # trust root is supplied. It mirrors deploy/registry-trust.dev.json, and
  # preflight-deployment.sh --strict rejects that file for the same reason --
  # this value is for local and staging clusters only.
  registry-trust.json: {{ "{\"publishers\":[]}" | b64enc }}
{{- end }}
{{- if or .Values.dshNode.enabled .Values.dshWeb.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dshNode.hostTokenSecret | quote }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.dshNode.hostTokenKey | quote }}: {{ include "lumo-platform.managedSecretValue" (dict "namespace" $ns "name" .Values.dshNode.hostTokenSecret "key" .Values.dshNode.hostTokenKey "length" 48) }}
{{- end }}
{{- if $terminalGateway.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.terminalGateway.signingSecret | quote }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Reused across upgrades by the same lookup as the bearers, and for a sharper
  # reason than convenience: rotating this key invalidates every signature
  # already in flight, so a value that changed on each `helm upgrade` would
  # turn routine releases into bursts of rejected sensitive actions. Unlike the
  # bearers, the *value* carries no entitlement -- verification is symmetric --
  # so a generated one is fine; what matters is that it stops changing.
  {{ .Values.terminalGateway.signingKey | quote }}: {{ include "lumo-platform.managedSecretValue" (dict "namespace" $ns "name" .Values.terminalGateway.signingSecret "key" .Values.terminalGateway.signingKey "length" 48) }}
{{- end }}
{{- if and .Values.dshWeb.enabled .Values.dshWeb.identityAssertion.secretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dshWeb.identityAssertion.secretName | quote }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # The auth proxy in front of dsh-web must sign with this same value, so it is
  # generated here only as a bootstrap: read it back with
  #   kubectl -n {{ $ns }} get secret {{ .Values.dshWeb.identityAssertion.secretName }} -o jsonpath='{.data.{{ .Values.dshWeb.identityAssertion.secretKey }}}' | base64 -d
  # and configure the proxy with it. Prefer identityAssertion.secretName="" plus
  # your own Secret once the proxy is in place.
  {{ .Values.dshWeb.identityAssertion.secretKey | quote }}: {{ include "lumo-platform.managedSecretValue" (dict "namespace" $ns "name" .Values.dshWeb.identityAssertion.secretName "key" .Values.dshWeb.identityAssertion.secretKey "length" 48) }}
{{- end }}
{{- end }}
