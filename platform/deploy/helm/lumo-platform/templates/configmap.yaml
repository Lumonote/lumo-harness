apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lumo-platform.name" . }}-config
data:
  LUMO_DEPLOYMENT_MODE: cluster
  LUMO_CLUSTER_STATUS: ready
  LUMO_PG_DSN: {{ .Values.postgres.dsn | quote }}
  REGISTRY_PG_DSN: {{ .Values.postgres.dsn | quote }}
  LUMO_REDIS_ADDR: {{ .Values.redis.address | quote }}
  LUMO_RMQ_ENDPOINT: {{ .Values.rocketmq.endpoint | quote }}
  LUMO_NACOS_ADDR: {{ .Values.nacos.address | quote }}
  LUMO_NACOS_SERVICE: {{ .Values.nacos.service | quote }}
  LUMO_NACOS_GROUP: {{ .Values.nacos.group | quote }}
  LUMO_OPA_ADDR: {{ .Values.opa.address | quote }}
  LUMO_LEDGER_TRANSPORT: rmq
  LUMO_MILVUS_URL: {{ .Values.knowledge.milvusUrl | quote }}
  LUMO_MILVUS_COLLECTION: {{ .Values.knowledge.milvusCollection | quote }}
  LUMO_NEBULA_URL: {{ .Values.knowledge.nebulaUrl | quote }}
  LUMO_EMBEDDING_BASE_URL: {{ .Values.knowledge.embeddingUrl | quote }}
  LUMO_EMBEDDING_MODEL: {{ .Values.knowledge.embeddingModel | quote }}
  LUMO_EMBEDDING_DIMENSION: {{ .Values.knowledge.embeddingDimension | quote }}
  LUMO_RERANK_BASE_URL: {{ .Values.knowledge.rerankUrl | quote }}
  LUMO_RERANK_MODEL: {{ .Values.knowledge.rerankModel | quote }}
  LUMO_VAULT_ADDR: {{ .Values.vault.address | quote }}
  LUMO_CORS_ORIGIN: {{ .Values.console.corsOrigin | quote }}
  LUMO_OTEL_COLLECTOR_URL: {{ .Values.productionControls.observability.collectorUrl | quote }}
  REGISTRY_TRUST_FILE: /etc/lumo/trust/registry-trust.json
