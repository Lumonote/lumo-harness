# Cluster（缩微）形态：自研服务多实例 + 中间件单实例。
# 启动：docker compose -f compose.cluster.yml up --build
# Go 控制面镜像由仓库内 Dockerfile 构建；dsh-node 源码位于同项目下被 Git 忽略的
# deepseek-harness/。Compose 默认使用已构建的 LUMO_DSH_IMAGE，便于替换发布镜像。
name: lumo-platform-cluster
version: "3.9"

volumes:
  pgdata:
  redisdata:
  miniodata:
  etcddata:
  milvusdata:
  nacosdata:
  rocketmqdata:
  registrydata:
  provisionerdata:
  dshwebdata:
  teidata:
  rerankdata:

secrets:
  registry-trust:
    file: "${REGISTRY_TRUST_FILE:-./registry-trust.dev.json}"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: ["POSTGRES_USER=${LUMO_POSTGRES_USER:-lumo}", "POSTGRES_PASSWORD=${LUMO_POSTGRES_PASSWORD:-lumo}", "POSTGRES_DB=${LUMO_POSTGRES_DB:-lumo}"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumo -d lumo"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    # 与 compose.standalone.yml / compose.local.yml **同源**：三处都是 `redis:7-alpine`。
    # 这里原先是 `redis:7`（来自最初的 scaffold），standalone 那份是后来另写的 alpine，
    # 属于各写各的漂移而不是取舍——症状是「standalone 能起的拓扑在 cluster 里行为不同」，
    # 而 `docker compose config` 两个文件各自都能过。门禁 `compose-images-verify.sh` 现在
    # 会拦住这类跨形态分歧，改一处必须改全。
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
  minio:
    # 见 compose.standalone.yml 同名服务的注释：Docker Hub 的 `minio/minio` 仓库已整体
    # 下线，必须走 quay.io 且钉具体版本，两个 compose 文件必须同源同版本——否则
    # standalone 能起的拓扑在 cluster 里起不来，反之亦然。
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: "${LUMO_MINIO_ROOT_USER:-lumo}"
      MINIO_ROOT_PASSWORD: "${LUMO_MINIO_ROOT_PASSWORD:-lumo-minio-123}"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    command: ["etcd", "--advertise-client-urls=http://etcd:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes:
      - etcddata:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
  milvus:
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    # During a full cold start Milvus can temporarily lose its etcd lease while
    # the Docker VM is CPU-starved. The process exits with 80 in that case and
    # is safe to restart against the same persisted volume.
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: "${LUMO_MINIO_ROOT_USER:-lumo}"
      MINIO_SECRET_ACCESS_KEY: "${LUMO_MINIO_ROOT_PASSWORD:-lumo-minio-123}"
    volumes:
      - milvusdata:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    depends_on:
      etcd: { condition: service_healthy }
      minio: { condition: service_healthy }
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    command: ["sh", "mqnamesrv"]
    healthcheck:
      # An empty cluster is still a healthy NameServer.  This checks that its
      # remoting endpoint has completed boot before the broker attempts to
      # register; service_started alone is only the wrapper process starting.
      #
      # Probe the port rather than run `mqadmin`: NettyRemotingServer binds 9876
      # only after boot completes, so a successful connect carries the same
      # guarantee for free.  `mqadmin` forks a fresh 1g-heap JVM per probe, which
      # cannot boot and complete a round-trip within any sane timeout — every
      # check gets killed mid-flight, and one such JVM every `interval` starves
      # the NameServer being checked, so the container never turns healthy.
      # /bin/sh in this image is dash and has no /dev/tcp; bash is installed.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9876"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  rocketmq:
    image: apache/rocketmq:5.3.1
    depends_on:
      rocketmq-namesrv: { condition: service_healthy }
    user: root
    # LOCAL Proxy 模式无法取得 NameServer；入口脚本运行独立 Broker/Proxy，并在
    # Broker 启动前可恢复地隔离崩溃遗留的空 consumerOffset 配置。
    command: ["bash", "/rocketmq-entrypoint.sh"]
    environment:
      JAVA_OPT_EXT: -Xms512m -Xmx512m -Xmn128m
      NAMESRV_ADDR: rocketmq-namesrv:9876
      # Cold starts replay the persisted store before Netty binds 10911. On a
      # busy Docker Desktop host this routinely exceeds the former 40s guard.
      # Persisted stores can take several minutes to recover while the DSH JVMs
      # and Nacos are cold-starting on a constrained Docker Desktop VM.
      ROCKETMQ_BROKER_START_TIMEOUT_SECONDS: "300"
    volumes:
      - ./rocketmq-broker-dev.conf:/rocketmq-broker-dev.conf:ro
      - ./rocketmq-entrypoint.sh:/rocketmq-entrypoint.sh:ro
      - rocketmqdata:/home/rocketmq/store
    healthcheck:
      # Broker 与独立 mqproxy 共用 netns；两端口都就绪才算服务健康。8081 是入口脚本
      # 建完 topic 之后才监听的，所以本探针顺带覆盖「topic 已就绪」；"registered with
      # NameServer" 断言也已在入口脚本内执行一次，健康检查不必反复启动 mqadmin JVM。
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/10911 && exec 4<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 300s

  # topic 预建（含「已向 NameServer 注册」断言）已并入 rocketmq 入口脚本，排在 mqproxy
  # 启动之前，故 healthy 蕴含 topic 已就绪；原独立的一次性 rocketmq-topic-init 容器已
  # 删除（2026-09-20，见 docs/implementation-status.md）。
  nacos:
    image: nacos/nacos-server:v2.4.0
    environment: [MODE=standalone]
    volumes:
      - nacosdata:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
  opa:
    # 版本**钉死**而不是 `latest`：策略文件的语义跟着 OPA 的主版本走（本仓库的 rego 用的是
    # 1.x 的 `if` 规则体语法），而 `session-control.rego` 是用 1.3.0 的
    # `opa check --strict` + `opa eval` 逐条验过的——浮动 tag 会让「验过的策略」与
    # 「在跑的引擎」不再对应同一件事。升级时连同策略一起验，不要靠漂移。
    image: openpolicyagent/opa:1.3.0
    # `--addr=0.0.0.0:8181` 不能省。**OPA 默认只监听容器内的 loopback**
    # （`run --server` 的日志是 `"addrs":["localhost:8181"]`），而 compose 网络里
    # 兄弟容器解析到的是容器 IP，不是 lo —— 于是 `http://opa:8181` 一律连接失败。
    # 后果不是「少一个守卫」而是**三个消费方全部静默 fail-closed**：
    # connector-gateway（`LUMO_OPA_ADDR`）的外部调用全拒、terminal-gateway 的 presence
    # 全拒、session-control 的每条控制指令都得到 `policy_unavailable`。fail-closed 是
    # 设计，所以症状看起来像「权限不足」而不是「连不上引擎」。
    # 实测（2026-09-16）：同一条 command 在自定义网络上做容器间 curl，
    # 默认绑定 → 000，加 `--addr` → 200。acceptance-cluster.sh 必填的
    # `LUMO_TEST_OPA_HEALTH_URL` 探针也会因此失败——那正是唯一能抓到这个的检查，
    # 而它至今没有完整跑过一轮。
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies:ro
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: ["--model-id", "${LUMO_EMBEDDING_MODEL:-BAAI/bge-m3}"]
    volumes:
      - teidata:/data
    restart: unless-stopped
  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: ["--model-id", "${LUMO_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}"]
    volumes:
      - rerankdata:/data
    restart: unless-stopped
  # 版本**钉死**而不是 `latest`（2026-09-20）。理由与上面 opa 那条同源：`latest` 已经
  # 漂到 **2.1.1**，相对仓库开发期的 1.x 是**跨大版本**，而凭证后端的语义漂移不会报错，
  # 只会让「验过的挂载与 token 路径」和「在跑的引擎」不再对应同一件事。
  # 钉 2.1.1 是**逐字节冻结现状**，不是换版本：实测 `hashicorp/vault:latest`、`:2.1`、
  # `:2.1.1` 三者 amd64 摘要同为 `sha256:8af37ae9d45e4a0fac48ab700e0d99efc4c2d6cd84354a869f2147f1d3abab46`。
  # 要换版本请连同 `docs/configuration.md` 的 KV v2 假设一起验，不要靠漂移。
  vault: { image: "hashicorp/vault:2.1.1", cap_add: ["IPC_LOCK"], environment: ["VAULT_DEV_ROOT_TOKEN_ID=${LUMO_VAULT_TOKEN:-dev-root-token}"], command: ["server", "-dev"] }
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/lumo-alerts.yml:ro
    ports: ["${LUMO_PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [scheduler-0]

  provisioner:
    profiles: [provisioner]
    build:
      context: ../control-plane
      dockerfile: registry/Dockerfile.provisioner
    image: lumo/provisioner:dev
    environment:
      REGISTRY_URL: http://registry:8084
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      PROVISIONER_ARTIFACT_NAME: "${PROVISIONER_ARTIFACT_NAME:-}"
      PROVISIONER_ARTIFACT_VERSION: "${PROVISIONER_ARTIFACT_VERSION:-}"
      PROVISIONER_ROLLOUT_CHANNEL: "${PROVISIONER_ROLLOUT_CHANNEL:-}"
      PROVISIONER_INSTALL_DIR: /var/lib/lumo/artifacts
      PROVISIONER_NODE_ID: provisioner
      PROVISIONER_INTERVAL: "${PROVISIONER_INTERVAL:-30s}"
      PROVISIONER_SHAPE: "${PROVISIONER_SHAPE:-{\"object\":true}}"
    volumes:
      - provisionerdata:/var/lib/lumo/artifacts
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/lumo/artifacts/install-state.jsonl.zst && test -f /var/lib/lumo/artifacts/skill-snapshot.json"]
      interval: 5s
      timeout: 3s
      retries: 24
    depends_on:
      registry: { condition: service_started }

  # 节点本地 Component 进程运行时。它只监听共享卷上的 Unix socket，默认不
  # 自动启动制品；管理员必须明确调用 artifact-runtime start。
  artifact-runtime:
    profiles: [provisioner]
    build:
      context: ../control-plane
      dockerfile: registry/Dockerfile.provisioner
    image: lumo/provisioner:dev
    entrypoint: ["artifact-runtime"]
    command: ["serve", "-dir", "/var/lib/lumo/artifacts", "-socket", "/var/lib/lumo/artifacts/artifact-runtime.sock"]
    volumes:
      - provisionerdata:/var/lib/lumo/artifacts
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/lib/lumo/artifacts/artifact-runtime.sock"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 原生 DeepSeek Harness Web 首页。Lumo UI 以 dsh.client 插件挂入同一个
  # AppFrame，并通过 dsh-node 的同源 /lumo/api 访问控制面。
  dsh-web:
    build: { context: ../.., dockerfile: platform/data-plane/dsh-node/Dockerfile }
    image: "${LUMO_DSH_IMAGE:-lumo/dsh-node:dev}"
    # The Harness process owns long-lived PostgreSQL clients. If PostgreSQL
    # performs crash recovery, restart the plugin host after its connections
    # are terminated so it can rebuild the complete runtime graph.
    restart: unless-stopped
    env_file: [./cluster-runtime.env]
    environment:
      - LUMO_SEAM_MODE=host
      - LUMO_DSH_PROFILE=web
      - LUMO_DEPLOYMENT_MODE=cluster
      - LUMO_CLUSTER_STATUS=ready
      - LUMO_SCHEDULER_URL=http://scheduler-0:8083
      # §8.4 共享执行控制（C5）的**提交入口**。没有它，`ctx.sessionControl.dispatch`
      # 只会抛 ControlCommandRoutingError —— 控制指令必须由调用方自己 POST 到控制面，
      # 而控制台后端并不知道那个地址。生效面（session_control_state 闸门）不依赖它。
      - LUMO_SESSION_CONTROL_URL=http://session-control:8092
      - LUMO_CLUSTER_ID=${LUMO_CLUSTER_ID:-cluster-a}
      - LUMO_AUTH_HOST=0.0.0.0
      - LUMO_AUTH_PORT=3080
      - "LUMO_AUTH_PUBLIC_URL=${LUMO_AUTH_PUBLIC_URL:-http://127.0.0.1:${LUMO_CONSOLE_PORT:-4173}}"
      - "LUMO_AUTH_SECURE_COOKIE=${LUMO_AUTH_SECURE_COOKIE:-false}"
      - "LUMO_CONTROL_PLANE_TOKEN=${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      - "LUMO_IDENTITY_ASSERTION_SECRET=${LUMO_IDENTITY_ASSERTION_SECRET:-}"
      - LUMO_WEB_PORT=3080
      - LUMO_NODE_ID=lumo-web
      - LUMO_ROLE=agent
      - "LUMO_REALM=${LUMO_REALM:-dev}"
      - "LUMO_USER_ID=${LUMO_USER_ID:-dev-user}"
      - "LUMO_USER_ROLE=${LUMO_USER_ROLE:-operator}"
      - "LUMO_PROJECT_ID=${LUMO_PROJECT_ID:-dev-project}"
      - "LUMO_DEPT_ID=${LUMO_DEPT_ID:-platform}"
      - "LUMO_PG_DSN=${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      - LUMO_REDIS_URL=redis://redis:6379
      - LUMO_MINIO_ENDPOINT=minio
      - LUMO_MINIO_PORT=9000
      - "LUMO_MINIO_ACCESS_KEY=${LUMO_MINIO_ROOT_USER:-lumo}"
      - "LUMO_MINIO_SECRET_KEY=${LUMO_MINIO_ROOT_PASSWORD:-lumo-minio-123}"
      - LUMO_MINIO_BUCKET=lumo-objects
      - LUMO_CONNECTOR_GATEWAY_URL=http://connector-gateway:8082
      - LUMO_SCHEDULER_API_URL=http://scheduler-0:8083
      - LUMO_PROJECTS_URL=http://projects:8086
      - LUMO_FLOWS_URL=http://flows:8087
      - LUMO_GOVERNANCE_URL=http://governance:8089
      - LUMO_SUBAGENT_HOST_TOKENS={"cluster-a-dsh-1":"${LUMO_SUBAGENT_HOST_TOKEN:-dev-subagent-token}"}
      - LUMO_NACOS_ADDR=http://nacos:8848
      - LUMO_NACOS_SERVICE=lumo-dsh-node
      - LUMO_NACOS_GROUP=DEFAULT_GROUP
      - "LUMO_SUBAGENT_HOST_TOKEN=${LUMO_SUBAGENT_HOST_TOKEN:-dev-subagent-token}"
      - LUMO_SUBAGENT_CALLBACK_HOST=dsh-web
      - LUMO_SUBAGENT_CALLBACK_BIND_HOST=0.0.0.0
      - LUMO_SUBAGENT_NODE_URLS={"cluster-a-dsh-1":"http://cluster-a-dsh-1:8091"}
      - "PROVISIONER_ARTIFACT_NAME=${PROVISIONER_ARTIFACT_NAME:-}"
    volumes:
      - provisionerdata:/var/lib/lumo/artifacts:ro
      - dshwebdata:/root/.dsh
    # @lumo/user-auth owns the public listener and injects governance-backed
    # signed identity into the loopback-only Harness WebServer.
    ports: ["127.0.0.1:${LUMO_CONSOLE_PORT:-4173}:3080"]
    depends_on:
      scheduler-0: { condition: service_started }
      projects: { condition: service_started }
      flows: { condition: service_started }
      connector-gateway: { condition: service_started }
      governance: { condition: service_started }

  cluster-a-dsh-0:
    build: { context: ../.., dockerfile: platform/data-plane/dsh-node/Dockerfile }
    image: "${LUMO_DSH_IMAGE:-lumo/dsh-node:dev}"
    restart: unless-stopped
    env_file: [./cluster-runtime.env]
    environment:
      - LUMO_SEAM_ENDPOINTS=http://cluster-a-dsh-1:8090
      - LUMO_NODE_ID=cluster-a-dsh-0
      - "LUMO_CONTROL_PLANE_TOKEN=${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      - LUMO_CLUSTER_ID=cluster-a
      - LUMO_ROLE=agent
      - LUMO_REALM=dev
      - "LUMO_PG_DSN=${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      - LUMO_REDIS_URL=redis://redis:6379
      - LUMO_MINIO_ENDPOINT=minio
      - LUMO_MINIO_PORT=9000
      - "LUMO_MINIO_ACCESS_KEY=${LUMO_MINIO_ROOT_USER:-lumo}"
      - "LUMO_MINIO_SECRET_KEY=${LUMO_MINIO_ROOT_PASSWORD:-lumo-minio-123}"
      - LUMO_MINIO_BUCKET=lumo-objects
      - LUMO_CONNECTOR_GATEWAY_URL=http://connector-gateway:8082
      - LUMO_SUBAGENT_HOST_TOKENS={"cluster-a-dsh-1":"${LUMO_SUBAGENT_HOST_TOKEN:-dev-subagent-token}"}
      - LUMO_SCHEDULER_URL=http://scheduler-0:8083
      # 同 dsh-web：控制指令的提交入口（§8.4）。
      - LUMO_SESSION_CONTROL_URL=http://session-control:8092
      - LUMO_NACOS_ADDR=http://nacos:8848
      - LUMO_NACOS_SERVICE=lumo-dsh-node
      - LUMO_NACOS_GROUP=DEFAULT_GROUP
      - "LUMO_SUBAGENT_HOST_TOKEN=${LUMO_SUBAGENT_HOST_TOKEN:-dev-subagent-token}"
      - LUMO_SUBAGENT_CALLBACK_HOST=cluster-a-dsh-0
      - LUMO_SUBAGENT_CALLBACK_BIND_HOST=0.0.0.0
      - LUMO_SUBAGENT_NODE_URLS={"cluster-a-dsh-1":"http://cluster-a-dsh-1:8091"}
      - "PROVISIONER_ARTIFACT_NAME=${PROVISIONER_ARTIFACT_NAME:-}"
    volumes:
      - provisionerdata:/var/lib/lumo/artifacts:ro
    depends_on:
      scheduler-0: { condition: service_started }
  cluster-a-dsh-1:
    build: { context: ../.., dockerfile: platform/data-plane/dsh-node/Dockerfile }
    image: "${LUMO_DSH_IMAGE:-lumo/dsh-node:dev}"
    restart: unless-stopped
    env_file: [./cluster-runtime.env]
    environment:
      - LUMO_NODE_ID=cluster-a-dsh-1
      - "LUMO_CONTROL_PLANE_TOKEN=${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      - LUMO_CLUSTER_ID=cluster-a
      - LUMO_ROLE=node
      # 承载节点是本集群的**上报方**：调度的联邦注册表只按自报判存活，而一个调度实例
      # 只能替一个集群自报（LUMO_SCHEDULER_CLUSTER_ID 单值）。没有这一行，cluster-a
      # 的判定输入就只能来自别处，判定一开就成了「没人报 → 全体 down → 新放置全被拒」。
      - LUMO_SCHEDULER_URL=http://scheduler-0:8083
      # 同 dsh-web：控制指令的提交入口（§8.4）。
      - LUMO_SESSION_CONTROL_URL=http://session-control:8092
      # 版本一致性前置（§7.4.1）的**声明方**。与存活同理：说「这个集群现在跑的是哪个
      # 版本」的必须是承载节点（跑着的那个东西的版本），不是调度器自己的版本。
      # 每个集群一个变量，是为了让「滚动升级升到一半」可以在本机复现：
      #   LUMO_CLUSTER_B_VERSION=v2 docker compose up
      # 默认两边都是 dev，于是闸门打开时判定为一致（放行）。
      - LUMO_CLUSTER_VERSION=${LUMO_CLUSTER_A_VERSION:-dev}
      - LUMO_REALM=dev
      - "LUMO_PG_DSN=${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      - LUMO_REDIS_URL=redis://redis:6379
      - LUMO_MINIO_ENDPOINT=minio
      - LUMO_MINIO_PORT=9000
      - "LUMO_MINIO_ACCESS_KEY=${LUMO_MINIO_ROOT_USER:-lumo}"
      - "LUMO_MINIO_SECRET_KEY=${LUMO_MINIO_ROOT_PASSWORD:-lumo-minio-123}"
      - LUMO_MINIO_BUCKET=lumo-objects
