      - "LUMO_AUTH_OIDC_DEFAULT_DEPARTMENT=${LUMO_AUTH_OIDC_DEFAULT_DEPARTMENT:-}"
      - "LUMO_AUTH_OIDC_ALLOW_SIGNUP=${LUMO_AUTH_OIDC_ALLOW_SIGNUP:-false}"
      - "LUMO_AUTH_OIDC_ALLOW_LOOPBACK_HTTP=${LUMO_AUTH_OIDC_ALLOW_LOOPBACK_HTTP:-false}"
