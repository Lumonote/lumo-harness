  # 每集群一份的**本地决策者**（architecture.md:703 的两层）。完整拓扑独立容器；
  # compact overlay 把同一 Scheduler 进程放进该集群 bundle，并保留 scheduler-cluster-a DNS alias。
  #
  # 它们存在的理由不是「多几个副本」，而是**让降级可达**：全局 scheduler（上面那对主备）
  # 没有 leader 时，本集群的任务仍要能落下去，而「本地」需要身份——一个服务两个集群的全局
  # 实例既没有、也不该有集群身份（认领了 cluster-a，cluster-b 的本地放置就没人管了）。
  # 没有这两个服务，`server.degradedPlacement` 的三条判据第一条就恒不成立，
  # 整条降级路径在任何拓扑里都走不到——那正是「门禁齐全而闸门从未打开」的老病。
  #
  # 顺带：设了 `LUMO_SCHEDULER_CLUSTER_ID` 即开启**自报**（见 cmd/scheduler/main.go 的
  # RunClusterReporter），于是「谁代表本集群宣称存活」有了天然归属——本地决策者。
  # 这一步**不**撤掉 dsh-node 侧的上报方：注册表本就接受多个上报方，而先加替代者、
  # 验证它确实在报，再撤旧路径，比在一次改动里两头都动安全。
