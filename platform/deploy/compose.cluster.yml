      - LUMO_INSTANCE=connector-gateway-0
      - LUMO_REDIS_ADDR=redis:6379
      - LUMO_LISTEN=:8082
      - LUMO_OPA_ADDR=http://opa:8181
      - LUMO_VAULT_ADDR=http://vault:8200
      - "LUMO_VAULT_TOKEN=${LUMO_VAULT_TOKEN:-dev-root-token}"
