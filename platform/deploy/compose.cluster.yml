      - "LUMO_AUTH_OIDC_ISSUER=${LUMO_AUTH_OIDC_ISSUER:-}"
      - "LUMO_AUTH_OIDC_CLIENT_ID=${LUMO_AUTH_OIDC_CLIENT_ID:-}"
      - "LUMO_AUTH_OIDC_CLIENT_SECRET=${LUMO_AUTH_OIDC_CLIENT_SECRET:-}"
      - "LUMO_AUTH_OIDC_REDIRECT_URL=${LUMO_AUTH_OIDC_REDIRECT_URL:-}"
      - "LUMO_AUTH_OIDC_REALM=${LUMO_AUTH_OIDC_REALM:-}"
