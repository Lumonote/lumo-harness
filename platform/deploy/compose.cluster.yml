      - LUMO_DESKTOP_GATEWAY_ENABLED=false
      - "LUMO_AUTH_BOOTSTRAP_REALM=${LUMO_REALM:-dev}"
      - "LUMO_AUTH_BOOTSTRAP_USER_ID=${LUMO_AUTH_BOOTSTRAP_USER_ID:-admin}"
      - "LUMO_AUTH_BOOTSTRAP_USERNAME=${LUMO_AUTH_BOOTSTRAP_USERNAME:-admin}"
      - "LUMO_AUTH_BOOTSTRAP_PASSWORD=${LUMO_AUTH_BOOTSTRAP_PASSWORD:-lumo-admin-123}"
      - "LUMO_AUTH_BOOTSTRAP_DISPLAY_NAME=${LUMO_AUTH_BOOTSTRAP_DISPLAY_NAME:-Lumo Administrator}"
      - "LUMO_AUTH_BOOTSTRAP_DEPARTMENT=${LUMO_AUTH_BOOTSTRAP_DEPARTMENT:-platform}"
      - "LUMO_AUTH_BOOTSTRAP_ROLES=${LUMO_AUTH_BOOTSTRAP_ROLES:-platform_admin,operator}"
