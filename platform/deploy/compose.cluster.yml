    depends_on:
      postgres: { condition: service_healthy }
    ports: ["18088:8088"]
  # 边缘网关（§12.1 南北向的「门」，缺口 C3）。它只干四件事：协议接入、路由分发、
  # 横切治理、边界隔离——门后才是真正的能力，所以路由表是它唯一的配置。
  #
  # 路由表**随仓库进容器**（只读挂载）而不是走 env 内联 JSON：这张表是「门后有哪些面」
  # 的声明，需要 review、diff 与门禁（platform/deploy/edge-routes-verify.sh），
  # 塞进 env 就三样都做不了。
  #
  # 限流复用与内部网关同一份共享令牌桶（§12.2「与内部网关共享同一限流库」）。
  # `LUMO_EDGE_LIMITER_FAIL_OPEN` 保持缺省 false：Redis 抖动时**拒绝**而不是放行。
  #
  # CORS 走 `LUMO_EDGE_CORS_ORIGINS`（网关自己的白名单，按**请求的 Origin** 裁决），
  # **不**设 `LUMO_CORS_ORIGIN`：后者是 observability 中间件读的名字，它会按配置的
  # 来源把 ACAO 写死，两个语义不同的 CORS 层叠在同一个响应上（gate.go:122-124 明确
  # 要求部署 edge-gateway 时不要再设它）。此处此前设的正是 `LUMO_CORS_ORIGIN`，
  # 于是边缘自己的白名单一直是空的、边缘层等于没在管事——注释、代码与部署三者不一致，
  # 而表现上又「能用」（中间件那层替它把 preflight 答了），所以没有门禁能看出来。
  edge-gateway:
    build: { context: ../control-plane, dockerfile: edge-gateway/Dockerfile }
    image: lumo/edge-gateway:dev
    environment: ["LUMO_PG_DSN=${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}", "LUMO_CONTROL_PLANE_TOKEN=${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}", "LUMO_INSTANCE=edge-gateway-0", "LUMO_LISTEN=:8080", "LUMO_EDGE_ROUTES=/etc/lumo/edge-routes.json", "LUMO_EDGE_REDIS_URL=redis://redis:6379", "LUMO_EDGE_CORS_ORIGINS=${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"]
    volumes: ["./edge-routes.dev.json:/etc/lumo/edge-routes.json:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["18080:8080"]
  # 终端网关（§8.2 多端，缺口 C4）：终端无关事件汇 + 能力协商 + replay + presence。
  # 它**不实现状态机**——pause/resume/stop 的语义在 session-control，终端只渲染视图
  # 与发送控制事件（§8.4.3 末句）。
  #
  # `LUMO_OPA_URL` 缺省为空 = **fail-closed**：presence 这类敏感动作在策略引擎不可用时
  # 被拒绝而不是放行。本地拓扑没有 OPA 容器，所以这里显式指向它并接受「敏感动作全拒」
  # 这一行为——那是安全的一侧，且日志会说明是策略引擎不可用而不是权限不足。
  terminal-gateway:
    build: { context: ../control-plane, dockerfile: terminal-gateway/Dockerfile }
    image: lumo/terminal-gateway:dev
    environment: ["LUMO_PG_DSN=${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}", "LUMO_CONTROL_PLANE_TOKEN=${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}", "LUMO_INSTANCE=terminal-gateway-0", "LUMO_LISTEN=:8090", "LUMO_OPA_URL=http://opa:8181", "LUMO_TERMINAL_SIGNING_SECRET=${LUMO_TERMINAL_SIGNING_SECRET:-dev-terminal-signing-secret}", "LUMO_CORS_ORIGIN=${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"]
    depends_on:
      postgres: { condition: service_healthy }
      opa: { condition: service_started }
    # 宿主端口刻意**避开 18090**：可选 overlay `compose.cluster.devices.yml` 已经把 18090 给了
    # governance 容器里的设备网关（TLS passthrough，见 docs/desktop-devices.md）。两个文件合并
    # 时同一宿主端口被声明两次，compose 会直接拒绝启动——而这条接线是手写的，没有任何机制会拦住它。
    ports: ["18091:8090"]
  # 共享执行控制（§8.4，缺口 C5）：pause/resume/stop/abort/approve/reject/replay/degrade
  # 一律裁成**可审计的一等事件**，并给出控制台要的只读投影（状态 + 此刻可点的按钮 +
  # 时间线 + 队列现场）。终端的控制按钮走这里，终端自己不实现状态机（§8.4.3 末句）。
  #
  # 两处与 terminal-gateway 同源的取舍：
  #   * `LUMO_OPA_URL` 指向 opa 而不是留空：每条控制指令必须经 OPA 评估（§8.4.2）。
  #     留空 = fail-closed 全拒；策略引擎不可用与权限不足在响应里是两个不同的码
  #     （policy_unavailable vs policy_denied），不会被误读成权限问题。
  #   * 同一会话同一时刻只有一条「生效中」的脉冲（§8.4.2 并发控制）：进程内队列保证
  #     本实例的 FIFO 与强制接管，库端行锁 + 版本比较后交换保证跨实例只有一条真正落地。
  #
  # **未接线**：把已生效的指令下发到会话执行面（§8.1 suspend / `agent.inject()`）。
  # 因此每条响应的 `effectuation` 恒为 recorded —— 状态与审计是真的，会话那边还没被动过。
  # 这是刻意的顺序（先落库再下发：**记了没做**可对账，**做了没记**无从追溯），不是遗漏。
  session-control:
    build: { context: ../control-plane, dockerfile: session-control/Dockerfile }
    image: lumo/session-control:dev
    environment: ["LUMO_PG_DSN=${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}", "LUMO_CONTROL_PLANE_TOKEN=${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}", "LUMO_INSTANCE=session-control-0", "LUMO_LISTEN=:8092", "LUMO_OPA_URL=http://opa:8181", "LUMO_CORS_ORIGIN=${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"]
    depends_on:
      postgres: { condition: service_healthy }
      opa: { condition: service_started }
    # 宿主端口按「18000 + 容器端口」= 18092。18090 留给可选 overlay 的设备网关、
    # 18091 已给 terminal-gateway、18093 是 scheduler-1，18092 是这段里最后一个空位。
    ports: ["18092:8092"]
  flows:
    build: { context: ../control-plane, dockerfile: flows/Dockerfile }
    image: lumo/flows:dev
    environment: ["LUMO_PG_DSN=${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}", "LUMO_CONTROL_PLANE_TOKEN=${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}", "LUMO_INSTANCE=flows-0", "LUMO_LISTEN=:8087", "LUMO_CORS_ORIGIN=${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["18087:8087"]
  projects:
    build: { context: ../control-plane, dockerfile: projects/Dockerfile }
    image: lumo/projects:dev
    environment: ["LUMO_PG_DSN=${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}", "LUMO_CONTROL_PLANE_TOKEN=${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}", "LUMO_INSTANCE=projects-0", "LUMO_LISTEN=:8086", "LUMO_CORS_ORIGIN=${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["18086:8086"]
  governance:
    build: { context: ../control-plane, dockerfile: governance/Dockerfile }
    image: lumo/governance:dev
    environment:
      - LUMO_PG_DSN=${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}
      - "LUMO_CONTROL_PLANE_TOKEN=${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      - LUMO_LISTEN=:8089
      - LUMO_DEPLOYMENT_MODE=cluster
      - LUMO_CLUSTER_STATUS=ready
      - LUMO_INSTANCE=governance-0
      # Enable the separate device TLS listener with compose.cluster.devices.yml.
      - LUMO_DESKTOP_GATEWAY_ENABLED=false
      - "LUMO_AUTH_BOOTSTRAP_REALM=${LUMO_REALM:-dev}"
      - "LUMO_AUTH_BOOTSTRAP_USER_ID=${LUMO_AUTH_BOOTSTRAP_USER_ID:-admin}"
      - "LUMO_AUTH_BOOTSTRAP_USERNAME=${LUMO_AUTH_BOOTSTRAP_USERNAME:-admin}"
      - "LUMO_AUTH_BOOTSTRAP_PASSWORD=${LUMO_AUTH_BOOTSTRAP_PASSWORD:-lumo-admin-123}"
      - "LUMO_AUTH_BOOTSTRAP_DISPLAY_NAME=${LUMO_AUTH_BOOTSTRAP_DISPLAY_NAME:-Lumo Administrator}"
      - "LUMO_AUTH_BOOTSTRAP_DEPARTMENT=${LUMO_AUTH_BOOTSTRAP_DEPARTMENT:-platform}"
      - "LUMO_AUTH_BOOTSTRAP_ROLES=${LUMO_AUTH_BOOTSTRAP_ROLES:-platform_admin,operator}"
      - "LUMO_AUTH_MAX_ATTEMPTS=${LUMO_AUTH_MAX_ATTEMPTS:-5}"
      - "LUMO_AUTH_LOCK_SECONDS=${LUMO_AUTH_LOCK_SECONDS:-300}"
      - "LUMO_AUTH_SESSION_TTL_SECONDS=${LUMO_AUTH_SESSION_TTL_SECONDS:-86400}"
      - "LUMO_AUTH_CAPTCHA_TTL_SECONDS=${LUMO_AUTH_CAPTCHA_TTL_SECONDS:-120}"
      # Optional: base64-encoded 32-byte AES-GCM key. MFA stays unavailable
      # until an operator supplies this through the deployment secret store.
      - "LUMO_AUTH_MFA_KEY=${LUMO_AUTH_MFA_KEY:-}"
      - "LUMO_AUTH_OIDC_ISSUER=${LUMO_AUTH_OIDC_ISSUER:-}"
      - "LUMO_AUTH_OIDC_CLIENT_ID=${LUMO_AUTH_OIDC_CLIENT_ID:-}"
      - "LUMO_AUTH_OIDC_CLIENT_SECRET=${LUMO_AUTH_OIDC_CLIENT_SECRET:-}"
      - "LUMO_AUTH_OIDC_REDIRECT_URL=${LUMO_AUTH_OIDC_REDIRECT_URL:-}"
      - "LUMO_AUTH_OIDC_REALM=${LUMO_AUTH_OIDC_REALM:-}"
      - "LUMO_AUTH_OIDC_DEPARTMENT_CLAIM=${LUMO_AUTH_OIDC_DEPARTMENT_CLAIM:-}"
      - "LUMO_AUTH_OIDC_DEFAULT_DEPARTMENT=${LUMO_AUTH_OIDC_DEFAULT_DEPARTMENT:-}"
      - "LUMO_AUTH_OIDC_ALLOW_SIGNUP=${LUMO_AUTH_OIDC_ALLOW_SIGNUP:-false}"
      - "LUMO_AUTH_OIDC_ALLOW_LOOPBACK_HTTP=${LUMO_AUTH_OIDC_ALLOW_LOOPBACK_HTTP:-false}"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["18089:8089"]
  usage-ledger:
    build: { context: ../control-plane, dockerfile: usage-ledger/Dockerfile }
    image: lumo/usage-ledger:dev
    environment: ["LUMO_PG_DSN=${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}", "LUMO_CONTROL_PLANE_TOKEN=${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}", "LUMO_INSTANCE=usage-ledger-0", "LUMO_RMQ_ENDPOINT=rocketmq:8081", "LUMO_LISTEN=:8085", "LUMO_CORS_ORIGIN=${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"]
    depends_on:
      postgres: { condition: service_healthy }
      # topic 预建已并入 rocketmq 入口脚本（排在 mqproxy 之前），healthy 蕴含 topic 已就绪。
      rocketmq: { condition: service_healthy }
    ports: ["18085:8085"]
