  # 每集群一份的**本地决策者**（architecture.md:703 的两层）。
  #
  # 它们存在的理由不是「多几个副本」，而是**让降级可达**：全局 scheduler（上面那对主备）
  # 没有 leader 时，本集群的任务仍要能落下去，而「本地」需要身份——一个服务两个集群的全局
  # 实例既没有、也不该有集群身份（认领了 cluster-a，cluster-b 的本地放置就没人管了）。
