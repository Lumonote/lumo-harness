  connector-gateway:
    build: { context: ../control-plane, dockerfile: connector-gateway/Dockerfile }
    image: lumo/connector-gateway:dev
    environment:
      - "LUMO_PG_DSN=${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      - "LUMO_CONTROL_PLANE_TOKEN=${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      # Instance identity for the heartbeat table. Without it the publisher falls
      # back to <container-id>-1, which makes the readiness report unreadable and
