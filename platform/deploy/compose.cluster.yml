    build: { context: ../control-plane, dockerfile: Dockerfile }
    command: ["/usr/local/bin/scheduler"]
    image: lumo/control-plane:dev
    environment: ["LUMO_PG_DSN=${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}", "LUMO_CONTROL_PLANE_TOKEN=${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}", "LUMO_INSTANCE=scheduler-cluster-a", "LUMO_LISTEN=:8083", "LUMO_NACOS_ADDR=http://nacos:8848", "LUMO_GOVERNANCE_URL=http://governance:8089", "LUMO_CORS_ORIGIN=${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}", "LUMO_CLUSTER_ENFORCE=true", "LUMO_SCHEDULER_CLUSTER_ID=cluster-a", "LUMO_CLUSTER_VERSION_GATE=${LUMO_CLUSTER_VERSION_GATE:-false}", "LUMO_PLACEMENT_LOAD_WEIGHT=${LUMO_PLACEMENT_LOAD_WEIGHT:-1}", "LUMO_PLACEMENT_AFFINITY_WEIGHT=${LUMO_PLACEMENT_AFFINITY_WEIGHT:-0.25}"]
