# RocketMQ broker 开发配置（Standalone/Cluster 本地拓扑专用，2026-08-26）。
#
# 用途与原因见 compose.standalone.yml 的 rocketmq 服务注释：Docker Desktop(macOS)
# 上宿主机不可达容器桥网 IP，broker 注册给 name server 的地址必须是宿主机可达的
# 127.0.0.1（经 published port 回连）。
#
# 生产在 K8s hostNetwork 下无此问题（容器 IP 即节点 IP），不放进生产镜像——本文件
# 只被本地 compose mount，不是发布物。
brokerIP1=127.0.0.1
namesrvAddr=localhost:9876
autoCreateTopicEnable=true
