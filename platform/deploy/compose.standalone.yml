# Server Standalone 形态：服务器单例拓扑；它不是本地桌面单机模式。
# 本地桌面单机请使用 platform/desktop（SQLite、无 RocketMQ/Nacos/MinIO/Redis/PostgreSQL）。
# 启动：docker compose -f compose.standalone.yml up -d
# 说明：这是可启动的服务器单例拓扑（RocketMQ namesrv+broker、Nacos、MinIO、
#       PG+pgvector、Redis；平台 Go 服务单实例）。Milvus 除外——其官方单容器 standalone
#       需伴生 etcd 与该清单共用 MinIO 需自配配置，故留注释块，对应能力 seam 明确不可用
#       （铁律 21：能力缺失显式拒绝，不得以别的库模拟）。
# 隔离：显式项目名（默认名会是目录名 deploy，与其它项目容器撞名）。
name: lumo-platform-standalone
version: "3.9"

services:
  # ---- 数据引擎（同引擎单实例）----
  postgres:      # pgvector 一处同理：Standalone 向量走 Milvus，PG 为 OLTP 主库
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: "${LUMO_POSTGRES_USER:-lumo}"
      POSTGRES_PASSWORD: "${LUMO_POSTGRES_PASSWORD:-lumo}"
      POSTGRES_DB: "${LUMO_POSTGRES_DB:-lumo}"
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:         # 热共享态/信箱读穿/限流（信箱持久性在 PG，铁律 8）
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data

  minio:         # 对象存储：日志冷层/制品/知识库原文
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${LUMO_MINIO_ROOT_USER:-lumo}"
      MINIO_ROOT_PASSWORD: "${LUMO_MINIO_ROOT_PASSWORD:-lumo-minio-123}"
    ports:
      - "19000:9000"    # S3 API
      - "19001:9001"    # 控制台
    volumes:
      - miniodata:/data

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    command: ["sh", "mqnamesrv"]
    ports:
      - "19876:9876"    # namesrv（remoting 客户端/运维）
    healthcheck:
      # 探端口而不是跑 mqadmin：NettyRemotingServer 只在 boot 完成后才 bind 9876，
      # 连上即等价于「remoting 已就绪」。mqadmin 每次探活都要新起一个 1g 堆的 JVM，
      # 在任何合理 timeout 内都跑不完一次往返，会被 Docker 中途 kill；而每 interval
      # 一个这样的 JVM 又会把被探测的 NameServer 饿死，容器永远转不成 healthy。
      # 镜像里 /bin/sh 是 dash（无 /dev/tcp），bash 已安装。
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9876"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  rocketmq:      # Broker + Proxy 前台进程（RocketMQ 5.3.1）
    #
    # 首次启动注意：镜像里没有 /home/rocketmq/store，docker 新建卷时属主为 root，
    # 运行用户 rocketmq 无权创建 config/ 子目录 → broker init 失败（NPE 假象，
    # 真实报错见容器内 logs/rocketmqlogs/broker.log 的 FileNotFoundException）。
    # 首次 up 后执行一次修复（见 deploy/README.md「首次启动」）：
    #   docker exec -u 0 lumo-platform-standalone-rocketmq-1 \
    #     chown -R rocketmq:rocketmq /home/rocketmq/store
    #
    # brokerIP1 必须写 127.0.0.1：容器网络里 broker 默认注册自己的 br 网段 IP，
    # 而 Docker Desktop(macOS) 上宿主机不可达容器 IP——客户端经 published port 得到
    # 的 broker 地址是 172.x，会连不上。dev broker.conf（rocketmq-broker-dev.conf）
    # 就是为此存在（生产 K8s hostNetwork 形态不需要它，见 helm 阶段 5）。
    # Broker 与独立 mqproxy 同容器运行并共享 netns；broker 注册 127.0.0.1，proxy
    # 仍可直连，客户端通过 8081 gRPC proxy，不会收到不可达的容器 bridge IP。
    # 已实测 `mqbroker --enable-proxy` LOCAL 模式不会把 broker conf 的 NameServer
    # 地址交给 ProxyStartup，会以 "NamesrvAddr is not configured" 退出。
    image: apache/rocketmq:5.3.1
    user: root
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command: ["bash", "/rocketmq-entrypoint.sh"]
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn128m"
      NAMESRV_ADDR: rocketmq-namesrv:9876
      # Keep the health window aligned with the entrypoint's persisted-store
      # recovery timeout so a valid cold start is not killed prematurely.
      ROCKETMQ_BROKER_START_TIMEOUT_SECONDS: "300"
    ports:
      - "10911:10911"   # broker remoting
      - "10909:10909"   # broker fast remoting
      - "8081:8081"     # proxy gRPC（v5 客户端——usage-ledger publisher/consumer）
    volumes:
      - ./rocketmq-broker-dev.conf:/rocketmq-broker-dev.conf:ro
      - ./rocketmq-entrypoint.sh:/rocketmq-entrypoint.sh:ro
      - rocketmqdata:/home/rocketmq/store
    healthcheck:
      # Broker 与独立 mqproxy 共用 netns；两端口都就绪才算服务健康。更强的
      # 「已向 NameServer 注册」断言交给 rocketmq-topic-init 做一次。
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/10911 && exec 4<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 300s

  nacos:         # 注册/配置中心（docs/README 三·补：Standalone 组成含 Nacos）
    image: nacos/nacos-server:v2.4.0
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "18848:8848"    # 控制台/客户端 HTTP
      - "19848:9848"    # 2.x gRPC（nacos-client 必需；只开 8848 客户端会超时）
    volumes:
      - nacosdata:/home/nacos/data

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus-standalone.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/lumo-alerts.yml:ro
    ports:
      - "${LUMO_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      scheduler-0:
        condition: service_started

  # 可选（需人工启用，见文件头说明）：milvus 单实例 —— 依赖伴生 etcd + 本清单 MinIO
  # 的自配 config；未启用时 ctx.knowledge.vector 侧 seam 显式不可用（铁律 21）。
  # milvus:
  #   image: milvusdb/milvus:latest
  #   command: ["milvus", "run", "standalone"]

  # ---- 平台编排（单实例；装配层差异，业务代码无 if(standalone)）----
  # —— 自研 Go 服务（与 compose.local.yml 同镜像，仅拓扑不同 —— 铁则：一套配置只换清单）——
  collaborator:         # 知识库文档实时协作（§5.4.7）
    build:
      context: ../control-plane
      dockerfile: collaborator/Dockerfile
    environment:
      LUMO_PG_DSN: "${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      LUMO_REDIS_ADDR: redis:6379
      LUMO_LISTEN: ":8081"
      LUMO_INSTANCE: collaborator-0
      LUMO_NACOS_ADDR: http://nacos:8848
      LUMO_NACOS_COLLABORATOR_SERVICE: lumo-collaborator
      LUMO_NODE_ADVERTISE_HOST: collaborator
      LUMO_NACOS_PORT: "8081"
      LUMO_CORS_ORIGIN: "${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"
    ports:
      - "18081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  dsh-node:
    build:
      context: ../..
      dockerfile: platform/data-plane/dsh-node/Dockerfile
    image: "${LUMO_DSH_IMAGE:-lumo/dsh-node:dev}"
    # Rebuild the long-lived plugin graph after a transient PostgreSQL recovery
    # terminates its active clients.
    restart: unless-stopped
    environment:
      LUMO_DSH_PROFILE: web
      LUMO_DEPLOYMENT_MODE: standalone
      LUMO_CLUSTER_STATUS: not_ready
      LUMO_WEB_PORT: "3080"
      # 一方用户认证代理监听容器内 0.0.0.0；宿主侧仍仅回环发布。
      LUMO_AUTH_HOST: 0.0.0.0
      LUMO_AUTH_PORT: "3080"
      LUMO_AUTH_PUBLIC_URL: "http://127.0.0.1:${LUMO_CONSOLE_PORT:-4173}"
      LUMO_NODE_ID: dsh-node-0
      LUMO_CLUSTER_ID: standalone
      LUMO_ROLE: node
      LUMO_REALM: "${LUMO_REALM:-dev}"
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      LUMO_IDENTITY_ASSERTION_SECRET: "${LUMO_IDENTITY_ASSERTION_SECRET:-}"
      LUMO_PG_DSN: "${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      LUMO_REDIS_URL: redis://redis:6379
      LUMO_MINIO_ENDPOINT: minio
      LUMO_MINIO_PORT: "9000"
      LUMO_MINIO_ACCESS_KEY: "${LUMO_MINIO_ROOT_USER:-lumo}"
      LUMO_MINIO_SECRET_KEY: "${LUMO_MINIO_ROOT_PASSWORD:-lumo-minio-123}"
      LUMO_MINIO_BUCKET: lumo-objects
      LUMO_CONNECTOR_GATEWAY_URL: http://connector-gateway:8082
      LUMO_SUBAGENT_HOST_BIND: 0.0.0.0
      LUMO_SUBAGENT_HOST_TOKEN: "${LUMO_SUBAGENT_HOST_TOKEN:-dev-subagent-token}"
      LUMO_SUBAGENT_CALLBACK_ALLOWED_ORIGINS: http://dsh-node:8092
      LUMO_NACOS_ADDR: http://nacos:8848
      LUMO_NODE_ADVERTISE_HOST: dsh-node
      LUMO_NODE_CAPACITY: "${LUMO_NODE_CAPACITY:-8}"
      LUMO_NODE_CAPABILITIES: "${LUMO_NODE_CAPABILITIES:-subagent}"
      LUMO_NODE_RESIDENCY: "${LUMO_NODE_RESIDENCY:-}"
      LUMO_SCHEDULER_URL: http://scheduler-0:8083
      LUMO_SCHEDULER_API_URL: http://scheduler-0:8083
      LUMO_PROJECTS_URL: http://projects:8086
      LUMO_FLOWS_URL: http://flows:8087
      LUMO_GOVERNANCE_URL: http://governance:8089
      LUMO_CORS_ORIGIN: "${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"
      PROVISIONER_ARTIFACT_NAME: "${PROVISIONER_ARTIFACT_NAME:-}"
    volumes:
      - provisionerdata:/var/lib/lumo/artifacts:ro
    # 与 cluster dsh-web 同款：仅回环发布；节点端口不出宿主机（走容器网络）。
    ports:
      - "127.0.0.1:${LUMO_CONSOLE_PORT:-4173}:3080"
    depends_on:
      scheduler-0:
        condition: service_started
      collaborator:
        condition: service_started
      governance:
        condition: service_started

  # 可选持续制品收敛器：默认不启动；设置 PROVISIONER_ARTIFACT_NAME/VERSION 后
  # 以 `--profile provisioner` 启动，interval 由 PROVISIONER_INTERVAL 注入。
  provisioner:
    profiles: [provisioner]
    build:
      context: ../control-plane
      dockerfile: registry/Dockerfile.provisioner
    image: lumo/provisioner:dev
    environment:
      REGISTRY_URL: http://registry:8084
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      PROVISIONER_ARTIFACT_NAME: "${PROVISIONER_ARTIFACT_NAME:-}"
      PROVISIONER_ARTIFACT_VERSION: "${PROVISIONER_ARTIFACT_VERSION:-}"
      PROVISIONER_INSTALL_DIR: /var/lib/lumo/artifacts
      PROVISIONER_INTERVAL: "${PROVISIONER_INTERVAL:-30s}"
      PROVISIONER_SHAPE: "${PROVISIONER_SHAPE:-{\"object\":true}}"
    volumes:
      - provisionerdata:/var/lib/lumo/artifacts
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/lumo/artifacts/install-state.jsonl.zst && test -f /var/lib/lumo/artifacts/skill-snapshot.json"]
      interval: 5s
      timeout: 3s
      retries: 24
    depends_on:
      registry:
        condition: service_started

  registry:
    build:
      context: ../control-plane
      dockerfile: registry/Dockerfile
    image: lumo/registry:dev
    environment:
      REGISTRY_PG_DSN: "${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      REGISTRY_TRUST_FILE: /run/secrets/registry-trust
      REGISTRY_S3_ENDPOINT: minio:9000
      REGISTRY_S3_ACCESS_KEY: "${LUMO_MINIO_ROOT_USER:-lumo}"
      REGISTRY_S3_SECRET_KEY: "${LUMO_MINIO_ROOT_PASSWORD:-lumo-minio-123}"
      REGISTRY_S3_BUCKET: lumo-registry
      REGISTRY_S3_SSL: "false"
      REGISTRY_PORT: "8084"
      LUMO_CORS_ORIGIN: "${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"
    volumes:
      - ./registry-trust.dev.json:/run/secrets/registry-trust:ro
    ports:
      - "18084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  connector-gateway:    # 外部连接器网关（§10.1）
    build:
      context: ../control-plane
      dockerfile: connector-gateway/Dockerfile
    environment:
      LUMO_PG_DSN: "${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      LUMO_REDIS_ADDR: redis:6379
      LUMO_LISTEN: ":8082"
      LUMO_ADMIN_ROLES: admin
      LUMO_CRED_PREFIX: LUMO_CRED_
      LUMO_CORS_ORIGIN: "${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"
    ports:
      - "18082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler-0:          # 全局任务调度 §6.2/§7.4.1（单节点；子实例多副本场景见 cluster）
    build:
      context: ../control-plane
      dockerfile: scheduler/Dockerfile
    environment:
      LUMO_PG_DSN: "${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      LUMO_LISTEN: ":8083"
      LUMO_INSTANCE: scheduler-0
      LUMO_CORS_ORIGIN: "${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"
    ports:
      - "18083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  # llm-gateway：模型访问面（§12 网关四门之一，P2a 起始项）——OpenAI 兼容入口 +
  # 计量单截面跨网（emitter=llm-gateway：写 usage_event_outbox，由 usage-ledger
  # 传输进台账）+ 双树预算执法镜像（reserve 四态 402 / commit 同事务扣减）。
  # 上游 provider 表按需 seed（指向本集群推理或外部 API）；预算树随 metering 建表。
  llm-gateway:
    build:
      context: ../control-plane
      dockerfile: llm-gateway/Dockerfile
    environment:
      LUMO_PG_DSN: "${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      LUMO_LISTEN: ":8088"
      LUMO_CORS_ORIGIN: "${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"
    ports:
      - "18088:8088"
    depends_on:
      postgres:
        condition: service_healthy

  # flows：第五类制品（用户自定义流程）——生命周期/FlowReview/定向分发/版本回滚
  #（§11 后半，制品层；执行是 FlowEngine P2）。只读 projects 服务的
  # project_members 表做成员判定（同库跨表，无服务间调用）。
  flows:
    build:
      context: ../control-plane
      dockerfile: flows/Dockerfile
    environment:
      LUMO_PG_DSN: "${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      LUMO_LISTEN: ":8087"
      LUMO_CORS_ORIGIN: "${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"
    ports:
      - "18087:8087"
    depends_on:
      postgres:
        condition: service_healthy

  # projects：项目工作区（§11.1 首切片）——项目实体/生命周期/成员角色/用量聚合。
  # N3 拍板 B（2026-08-26）：项目 = 并行预算树——创建即种子 budget_trees
  # kind='project' 行；执法（双树同事务扣减）在 TS metering，本服务只治理不执法。
  projects:
    build:
      context: ../control-plane
      dockerfile: projects/Dockerfile
    environment:
      LUMO_PG_DSN: "${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      LUMO_LISTEN: ":8086"
      LUMO_CORS_ORIGIN: "${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"
    ports:
      - "18086:8086"
    depends_on:
      postgres:
        condition: service_healthy

  # 组织治理和桌面节点服务始终可观测，但仅 Cluster+ready 形态会放行其写 API。
  # Standalone 显式返回 CLUSTER_ONLY，不能因本机恰好存在 Nacos 而误开启多租户功能。
  governance:
    build:
      context: ../control-plane
      dockerfile: governance/Dockerfile
    environment:
      LUMO_PG_DSN: "${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      LUMO_LISTEN: ":8089"
      LUMO_DEPLOYMENT_MODE: "standalone"
      LUMO_CLUSTER_STATUS: "not_ready"
      LUMO_SCHEDULER_URL: http://scheduler-0:8083
      LUMO_AUTH_BOOTSTRAP_REALM: "${LUMO_REALM:-dev}"
      LUMO_AUTH_BOOTSTRAP_USER_ID: "${LUMO_AUTH_BOOTSTRAP_USER_ID:-admin}"
      LUMO_AUTH_BOOTSTRAP_USERNAME: "${LUMO_AUTH_BOOTSTRAP_USERNAME:-admin}"
      LUMO_AUTH_BOOTSTRAP_PASSWORD: "${LUMO_AUTH_BOOTSTRAP_PASSWORD:-lumo-admin-123}"
      LUMO_AUTH_BOOTSTRAP_DISPLAY_NAME: "${LUMO_AUTH_BOOTSTRAP_DISPLAY_NAME:-Lumo Administrator}"
      LUMO_AUTH_BOOTSTRAP_DEPARTMENT: "${LUMO_AUTH_BOOTSTRAP_DEPARTMENT:-platform}"
      LUMO_AUTH_BOOTSTRAP_ROLES: "${LUMO_AUTH_BOOTSTRAP_ROLES:-platform_admin,operator}"
      LUMO_AUTH_MAX_ATTEMPTS: "${LUMO_AUTH_MAX_ATTEMPTS:-5}"
      LUMO_AUTH_LOCK_SECONDS: "${LUMO_AUTH_LOCK_SECONDS:-300}"
      LUMO_AUTH_SESSION_TTL_SECONDS: "${LUMO_AUTH_SESSION_TTL_SECONDS:-86400}"
      LUMO_AUTH_CAPTCHA_TTL_SECONDS: "${LUMO_AUTH_CAPTCHA_TTL_SECONDS:-120}"
    ports:
      - "18089:8089"
    depends_on:
      postgres:
        condition: service_healthy

  # usage-ledger：计量台账 RocketMQ 传输（§6.4 异步削峰，设计说明 2026-08-26）。
  # publisher（outbox→broker）+ consumer（broker→usage_ledger）双 goroutine 单实例。
  # 装配互斥：dsh-node 侧 metering 插件须配 ledgerTransport: 'rmq'（本形态）——
  # 台账单一写入者，TS drain 轮询不并存（判据 7）。
  usage-ledger:
    build:
      context: ../control-plane
      dockerfile: usage-ledger/Dockerfile
    environment:
      LUMO_PG_DSN: "${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      LUMO_RMQ_ENDPOINT: rocketmq:8081   # 容器网内直连 proxy gRPC（无需宿主端口绕行）
      LUMO_RMQ_GROUP: usage-ledger
      LUMO_LISTEN: ":8085"
      LUMO_CORS_ORIGIN: "${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"
    ports:
      - "18085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      rocketmq-topic-init:
        condition: service_completed_successfully

  # 计量闭集 topic 预建（一次性；幂等）：topic 必须先于 usage-ledger 存在——
  # v5 producer 启动期路由查询不等 autoCreate（实测，设计说明 §8）。与 rocketmq
  # 共享 netns → broker 注册的 127.0.0.1 在本容器内可达。
  rocketmq-topic-init:
    image: apache/rocketmq:5.3.1
    network_mode: "service:rocketmq"
    depends_on:
      rocketmq:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        export JAVA_HOME="$${JAVA_HOME:-/opt/java/openjdk}"
        export PATH="$$JAVA_HOME/bin:$$PATH"
        # healthcheck 只探端口，不覆盖「broker 已向 NameServer 注册」——该断言放在
        # 这个一次性 init 容器里付一次 JVM 代价，而不是每 5s 重复付（见
        # rocketmq-namesrv 注释）。断言 clusterList 里出现注册地址 127.0.0.1:10911，
        # 同时验证 rocketmq-broker-dev.conf 的 brokerIP1 生效。
        max_attempts=60
        attempt=1
        until sh mqadmin clusterList -n rocketmq-namesrv:9876 2>/dev/null | grep -q '127\.0\.0\.1:10911'; do
          if [ "$$attempt" -ge "$$max_attempts" ]; then
            echo "RocketMQ broker never registered with NameServer after $$max_attempts attempts" >&2
            sh mqadmin clusterList -n rocketmq-namesrv:9876 || true
            exit 1
          fi
          echo "waiting broker registration ($$attempt/$$max_attempts) ..."
          attempt=$$((attempt + 1))
          sleep 3
        done
        # 注册已确认，直接对同 netns 的 10911 建 topic。
        for t in usage-events-llm-tokens usage-events-connector-call usage-events-seam-query \
                 usage-events-job-compute usage-events-storage-bytes usage-events-inference-gpu; do
          attempt=1
          until sh mqadmin updateTopic -b localhost:10911 -t $$t >/dev/null 2>&1; do
            if [ "$$attempt" -ge "$$max_attempts" ]; then
              echo "RocketMQ broker did not accept topic $$t after $$max_attempts attempts" >&2
              sh mqadmin brokerStatus -b localhost:10911 || true
              sh mqadmin clusterList -n rocketmq-namesrv:9876 || true
              exit 1
            fi
            echo "waiting broker for $$t ($$attempt/$$max_attempts) ..."
            attempt=$$((attempt + 1))
            sleep 3
          done
        done
        echo "usage-events topics ready"

  # dsh-node：dsh 容器 + @lumo/* 插件（阶段 1+ 填充；本形态单节点）
  # 用例：cd .. && pnpm --filter @lumo/platform run local（本地裸进程）或
  #       docker build -t lumo/dsh-node dev 后以本清单运行

volumes:
  pgdata:
  miniodata:
  redisdata:
  nacosdata:
  rocketmqdata:
  provisionerdata:
