# Server Standalone 形态：服务器单例拓扑；它不是本地桌面单机模式。
# 本地桌面单机请使用 platform/desktop（SQLite、无 RocketMQ/Nacos/MinIO/Redis/PostgreSQL）。
# 启动：./platform/deploy/up.sh standalone -d
# 说明：这是可启动的服务器单例拓扑。公共基础组件来自 compose.shared.yml，
#       10 个 API、Scheduler、Collaborator 合并在一个控制面容器，DSH 节点保留独立身份。
#       Milvus 除外——其官方单容器 standalone
#       需伴生 etcd 与该清单共用 MinIO 需自配配置，故留注释块，对应能力 seam 明确不可用
#       （铁律 21：能力缺失显式拒绝，不得以别的库模拟）。
# 单例与集群共用项目名、基础服务定义及数据卷。
name: lumo-platform
version: "3.9"

services:
  api-bundle:
    command: ["/usr/local/bin/lumo-control-plane-bundle", "platform-standalone"]
    environment:
      LUMO_NACOS_ADDR: http://nacos:8848
      LUMO_NACOS_SERVICE: lumo-dsh-node
      LUMO_NACOS_GROUP: DEFAULT_GROUP
      LUMO_REDIS_ADDR: redis:6379
      LUMO_NACOS_COLLABORATOR_SERVICE: lumo-collaborator
      LUMO_KNOWLEDGE_SEAM_URL: http://dsh-node:8090
      LUMO_KNOWLEDGE_EMBEDDING_MODEL: "${LUMO_EMBEDDING_MODEL:-BAAI/bge-m3}"
      LUMO_IDENTITY_ASSERTION_SECRET: "${LUMO_IDENTITY_ASSERTION_SECRET:-}"
      LUMO_BUNDLE_COLLABORATOR_0_LUMO_NODE_ADVERTISE_HOST: collaborator
      LUMO_BUNDLE_COLLABORATOR_0_LUMO_NACOS_PORT: "8081"
    ports:
      - "18080:8080"
      - "18081:8081"
      - "18082:8082"
      - "18083:8083"
      - "18084:8084"
      - "18085:8085"
      - "18086:8086"
      - "18087:8087"
      - "18088:8088"
      - "18089:8089"
      - "18091:8090"
      - "18092:8092"
    healthcheck:
      test: ["CMD", "/usr/local/bin/lumo-control-plane-bundle", "healthcheck", "platform-standalone"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    networks:
      default:
        aliases: [collaborator, collaborator-0, scheduler-0]
  postgres: { ports: ["15432:5432"] }
  redis: { ports: ["16379:6379"] }
  minio: { ports: ["19000:9000", "19001:9001"] }
  rocketmq: { ports: ["19876:9876", "10911:10911", "10909:10909", "8081:8081"] }
  nacos: { ports: ["18848:8848", "19848:9848"] }
  # ---- 数据引擎（同引擎单实例）----
  prometheus:
    volumes:
      - ./prometheus-standalone.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api-bundle:
        condition: service_healthy

  # 可选（需人工启用，见文件头说明）：milvus 单实例 —— 依赖伴生 etcd + 本清单 MinIO
  # 的自配 config；未启用时 ctx.knowledge.vector 侧 seam 显式不可用（铁律 21）。
  # milvus:
  #   image: milvusdb/milvus:latest
  #   command: ["milvus", "run", "standalone"]

  # ---- DSH 数据平面 ----
  dsh-node:
    build:
      context: ../..
      dockerfile: platform/data-plane/dsh-node/Dockerfile
    image: "${LUMO_DSH_IMAGE:-lumo/dsh-node:dev}"
    # Rebuild the long-lived plugin graph after a transient PostgreSQL recovery
    # terminates its active clients.
    restart: unless-stopped
    environment:
      LUMO_DSH_PROFILE: web
      LUMO_DEPLOYMENT_MODE: standalone
      LUMO_CLUSTER_STATUS: not_ready
      LUMO_WEB_PORT: "3080"
      # 一方用户认证代理监听容器内 0.0.0.0；宿主侧仍仅回环发布。
      LUMO_AUTH_HOST: 0.0.0.0
      LUMO_AUTH_PORT: "3080"
      LUMO_AUTH_PUBLIC_URL: "http://127.0.0.1:${LUMO_CONSOLE_PORT:-4173}"
      LUMO_NODE_ID: dsh-node-0
      LUMO_CLUSTER_ID: standalone
      LUMO_ROLE: node
      LUMO_REALM: "${LUMO_REALM:-dev}"
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      LUMO_IDENTITY_ASSERTION_SECRET: "${LUMO_IDENTITY_ASSERTION_SECRET:-}"
      LUMO_PG_DSN: "${LUMO_PG_DSN:-postgres://lumo:lumo@postgres:5432/lumo}"
      LUMO_REDIS_URL: redis://redis:6379
      LUMO_MINIO_ENDPOINT: minio
      LUMO_MINIO_PORT: "9000"
      LUMO_MINIO_ACCESS_KEY: "${LUMO_MINIO_ROOT_USER:-lumo}"
      LUMO_MINIO_SECRET_KEY: "${LUMO_MINIO_ROOT_PASSWORD:-lumo-minio-123}"
      LUMO_MINIO_BUCKET: lumo-objects
      LUMO_CONNECTOR_GATEWAY_URL: http://connector-gateway:8082
      LUMO_LLM_GATEWAY_URL: http://llm-gateway:8088
      LUMO_USAGE_LEDGER_URL: http://usage-ledger:8085
      LUMO_EDGE_GATEWAY_URL: http://edge-gateway:8080
      LUMO_TERMINAL_GATEWAY_URL: http://terminal-gateway:8090
      LUMO_SUBAGENT_HOST_BIND: 0.0.0.0
      LUMO_SUBAGENT_HOST_TOKEN: "${LUMO_SUBAGENT_HOST_TOKEN:-dev-subagent-token}"
      LUMO_SUBAGENT_CALLBACK_ALLOWED_ORIGINS: http://dsh-node:8092
      LUMO_NACOS_ADDR: http://nacos:8848
      LUMO_NODE_ADVERTISE_HOST: dsh-node
      LUMO_NODE_CAPACITY: "${LUMO_NODE_CAPACITY:-8}"
      LUMO_NODE_CAPABILITIES: "${LUMO_NODE_CAPABILITIES:-subagent}"
      LUMO_NODE_RESIDENCY: "${LUMO_NODE_RESIDENCY:-}"
      LUMO_SCHEDULER_URL: http://scheduler-0:8083
      LUMO_SCHEDULER_API_URL: http://scheduler-0:8083
      # §8.4 共享执行控制（C5）的提交入口，见 compose.cluster.yml 的 dsh-web 段。
      #
      # **刻意不进 depends_on**：`dispatch` 是运行期按需调用，不是启动期依赖。
      # 把它写进 depends_on 会把「控制面起不来」升级成「数据面也起不来」——
      # 而控制面不可用时，会话本身仍然可以跑，只是控制指令提交不了（调用方会拿到
      # ControlPlaneUnreachableError）。可选依赖不该阻断主链路。
      LUMO_SESSION_CONTROL_URL: http://session-control:8092
      LUMO_PROJECTS_URL: http://projects:8086
      LUMO_FLOWS_URL: http://flows:8087
      LUMO_GOVERNANCE_URL: http://governance:8089
      LUMO_REGISTRY_URL: http://registry:8084
      LUMO_CORS_ORIGIN: "${LUMO_CORS_ORIGIN:-http://127.0.0.1:4173}"
      PROVISIONER_ARTIFACT_NAME: "${PROVISIONER_ARTIFACT_NAME:-}"
    volumes:
      - provisionerdata:/var/lib/lumo/artifacts:ro
    # 与 cluster dsh-web 同款：仅回环发布；节点端口不出宿主机（走容器网络）。
    ports:
      - "127.0.0.1:${LUMO_CONSOLE_PORT:-4173}:3080"
    depends_on:
      api-bundle:
        condition: service_healthy

  # 可选持续制品收敛器：默认不启动；设置制品名和显式 VERSION，或设置
  # ROLLOUT_CHANNEL 由 Registry 的期望状态决定版本后，以 profile 启动。
  provisioner:
    profiles: [provisioner]
    build:
      context: ../control-plane
      dockerfile: registry/Dockerfile.provisioner
    image: lumo/provisioner:dev
    environment:
      REGISTRY_URL: http://registry:8084
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      PROVISIONER_ARTIFACT_NAME: "${PROVISIONER_ARTIFACT_NAME:-}"
      PROVISIONER_ARTIFACT_VERSION: "${PROVISIONER_ARTIFACT_VERSION:-}"
      PROVISIONER_ROLLOUT_CHANNEL: "${PROVISIONER_ROLLOUT_CHANNEL:-}"
      PROVISIONER_INSTALL_DIR: /var/lib/lumo/artifacts
      PROVISIONER_INTERVAL: "${PROVISIONER_INTERVAL:-30s}"
      PROVISIONER_SHAPE: "${PROVISIONER_SHAPE:-{\"object\":true}}"
    volumes:
      - provisionerdata:/var/lib/lumo/artifacts
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/lumo/artifacts/install-state.jsonl.zst && test -f /var/lib/lumo/artifacts/skill-snapshot.json"]
      interval: 5s
      timeout: 3s
      retries: 24
    depends_on:
      api-bundle:
        condition: service_healthy

  # 受控 Component 进程运行时。管理 API 只在共享卷上的 Unix socket 暴露，
  # 不发布宿主机端口；制品须由 Provisioner 先完成签名与 digest 校验。
  artifact-runtime:
    profiles: [provisioner]
    build:
      context: ../control-plane
      dockerfile: registry/Dockerfile.provisioner
    image: lumo/provisioner:dev
    entrypoint: ["artifact-runtime"]
    command: ["serve", "-dir", "/var/lib/lumo/artifacts", "-socket", "/var/lib/lumo/artifacts/artifact-runtime.sock"]
    volumes:
      - provisionerdata:/var/lib/lumo/artifacts
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/lib/lumo/artifacts/artifact-runtime.sock"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  provisionerdata:
