# Local-lite 形态：1 二进制 + 1 PG —— 秒级启动，数据一次性（不承诺迁移，见 architecture §13.2）
# 启动：docker compose -f compose.local.yml up
# 项目/容器命名隔离：lumo-platform-* 前缀，与用户其它 compose 项目（如 lumonte-*）互不影响；
# down -v 仅作用于本项目卷。
name: lumo-platform-local
version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lumo-platform-postgres
    environment:
      POSTGRES_USER: lumo
      POSTGRES_PASSWORD: lumo
      POSTGRES_DB: lumo
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

# 平台进程（dsh node）本地裸进程运行：
#   source ~/.nvm/nvm.sh && nvm use 24
#   pnpm --filter @lumo/platform run local
# 该形态缺 OLAP/图能力，对应 seam 返回 CapabilityUnavailable（显式拒绝，非模拟）
