# Legacy Local-lite 集成测试台：它会启动 PostgreSQL/Redis/Embedding，仅用于开发与契约测试。
# 它不是产品的本地单机模式。产品本地单机必须使用 platform/desktop：SQLite 且无中间件。
# 启动：docker compose -f compose.local.yml up
# 项目/容器命名隔离：lumo-platform-* 前缀，与用户其它 compose 项目（如 lumonte-*）互不影响；
# down -v 仅作用于本项目卷。
name: lumo-platform-local
version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lumo-platform-postgres
    environment:
      POSTGRES_USER: lumo
      POSTGRES_PASSWORD: lumo
      POSTGRES_DB: lumo
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumo"]
      interval: 5s
      timeout: 3s
      retries: 10

  embedding:            # TEI 文本嵌入（bge-m3, 1024 维；LLM embedding 的独立 Provider，§5.4.4 版本化）
    # CPU 变体：默认 1.6 是 CUDA 构建，本机（Local-lite 开发机）无 GPU 会缺 libcuda.so.1
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: lumo-platform-tei
    environment:
      MODEL_ID: BAAI/bge-m3
      PORT: "80"
    ports:
      - "55433:80"
    volumes:
      - tei-data:/data

  rerank:               # TEI 交叉编码器重排（§5.4.5）。可选组件：不配置 knowledge.rerank 时
                        # 两个 Consumer 完全不重排，本服务可以不起。
    # 与 embedding 同镜像不同模型 —— 换模型即换实例，不复用同一地址。
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: lumo-platform-tei-rerank
    environment:
      # 568M 参数，CPU 变体上明显慢于 bge-m3；体感不足时换 BAAI/bge-reranker-base（278M），
      # 两者走同一个 /rerank 端点，RerankClient 无需改动。
      MODEL_ID: BAAI/bge-reranker-v2-m3
      PORT: "80"
    ports:
      - "55434:80"
    volumes:
      - tei-rerank-data:/data

  redis:                # 协作服务 WAL 热层（§5.4.7.4：确认前必须已落 WAL）
    image: redis:7-alpine
    container_name: lumo-platform-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data

  collaborator:         # 知识库文档实时协作（§5.4.7；平台唯一有状态业务服务）
    build:
      context: ../control-plane/collaborator
    container_name: lumo-platform-collaborator
    environment:
      LUMO_PG_DSN: postgres://lumo:lumo@postgres:5432/lumo
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      LUMO_REDIS_ADDR: redis:6379
      LUMO_LISTEN: ":8081"
      LUMO_INSTANCE: collaborator-0
    ports:
      - "58081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  connector-gateway:    # 外部连接器网关（§10.1；四道闸 + PII 脱敏 + 审计）
    build:
      context: ../control-plane/connector-gateway
    container_name: lumo-platform-connector-gateway
    environment:
      LUMO_PG_DSN: postgres://lumo:lumo@postgres:5432/lumo
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      LUMO_REDIS_ADDR: redis:6379
      LUMO_LISTEN: ":8082"
      LUMO_ADMIN_ROLES: admin
      # Local-lite 凭证形态：manifest 的 credentialRef 映射成
      # LUMO_CRED_<REF 大写、非字母数字转 _>，凭证本身只经环境变量注入，不落库。
      # 例：credentialRef "jira/token" → 环境变量 LUMO_CRED_JIRA_TOKEN
      LUMO_CRED_PREFIX: LUMO_CRED_
    ports:
      - "58082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler-0:         # 全局任务调度 §6.2/§7.4.1（评审 N1：leader 选举 + fencing）
    build:
      context: ../control-plane/scheduler
    container_name: lumo-platform-scheduler-0
    environment:
      LUMO_PG_DSN: postgres://lumo:lumo@postgres:5432/lumo
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      LUMO_LISTEN: ":8083"
      LUMO_INSTANCE: scheduler-0
    ports:
      - "58083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler-1:         # 热备（1+1）：kill leader 验证接管（§13.2.5 场景）
    build:
      context: ../control-plane/scheduler
    container_name: lumo-platform-scheduler-1
    environment:
      LUMO_PG_DSN: postgres://lumo:lumo@postgres:5432/lumo
      LUMO_CONTROL_PLANE_TOKEN: "${LUMO_CONTROL_PLANE_TOKEN:?LUMO_CONTROL_PLANE_TOKEN must be set}"
      LUMO_LISTEN: ":8083"
      LUMO_INSTANCE: scheduler-1
    ports:
      - "58084:8083"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  tei-data:
  tei-rerank-data:

# 平台进程（dsh node）本地裸进程运行：
#   source ~/.nvm/nvm.sh && nvm use 24
#   pnpm --filter @lumo/platform run local
# 该形态缺 OLAP 能力（Doris），对应 seam 返回 CapabilityUnavailable（显式拒绝，非模拟）。
# 图能力由 PG 递归 CTE 轻量替代（铁律 21：Local-lite 允许换引擎，不承诺迁移）；
# Standalone+ 换 Nebula Provider，Consumer 侧契约不变。
