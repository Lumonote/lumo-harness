# Optional native DeepSeek Harness configuration. Append after the topology files.
# Required: DSH_MODELS_PATCH_FILE and DSH_MODEL_CREDENTIALS_FILE are operator-owned
# absolute file paths. No provider protocol or secret is generated by this layer.
# The home patch outranks per-profile Settings; update its source and recreate
# containers to change managed values. See docs/configuration.md.
services:
  dsh-web:
    env_file:
      - path: "${DSH_MODEL_CREDENTIALS_FILE:?Set an absolute credentials env file path}"
        required: true
        format: raw
    volumes:
      - type: bind
        source: "${DSH_MODELS_PATCH_FILE:?Set an absolute native cordis.patch.yml path}"
        target: /root/.dsh/cordis.patch.yml
        read_only: true
        bind: { create_host_path: false }
  cluster-a-dsh-0:
    env_file:
      - path: "${DSH_MODEL_CREDENTIALS_FILE:?Set an absolute credentials env file path}"
        required: true
