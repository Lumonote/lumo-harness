global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/lumo-alerts.yml
scrape_configs:
  - job_name: lumo-control-plane
    metrics_path: /metrics
    static_configs:
      - targets: [collaborator-0:8081, collaborator-1:8081, scheduler-0:8083, scheduler-1:8083, registry:8084, connector-gateway:8082, llm-gateway:8088, flows:8087, projects:8086, usage-ledger:8085]
