# 推送 v* tag 自动准备 Release 草稿（或同步已有 Release 正文），不提前发布。
#
# 与 release.yml 的分工：
#   - 本 workflow 只把 CHANGELOG 同步到草稿或已有 Release 页面；
#   - release.yml 在桌面构建及真实集群验收通过后上传产物并发布同一个 Release。
# 两者都对「Release 已存在」做了幂等处理（更新 / 覆盖上传），所以先后顺序无所谓。
# 正文抽取逻辑与 release.yml 共用 .github/scripts/release-notes.sh，保证两边一致。
#
# Only prepare a draft when the Release does not exist. release.yml publishes
# it after desktop builds AND real cluster fault acceptance pass; this fast
# notes workflow must not bypass that release gate or demote an existing release.
name: changelog-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 回退分支要用 git describe 找上一个 tag，浅克隆拿不到。
          fetch-depth: 0

      - name: Generate release notes from CHANGELOG
        run: |
          set -euo pipefail
          bash .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          echo '--- 将写入 Release 的正文 ---'
          cat "$RUNNER_TEMP/notes.md"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi
