# 推送 v* tag 即自动创建（或更新）GitHub Release，正文取自 CHANGELOG.md 对应版本的小节。
#
# 与 release.yml 的分工：
#   - 本 workflow 只把 CHANGELOG 同步到 Release 页面，不构建任何东西，秒级完成；
#   - release.yml 负责构建桌面安装包并上传到同一个 Release（同样由 tag 推送触发，耗时数十分钟）。
# 两者都对「Release 已存在」做了幂等处理（更新 / 覆盖上传），所以先后顺序无所谓。
# 正文抽取逻辑与 release.yml 共用 .github/scripts/release-notes.sh，保证两边一致。
#
# 为什么要显式 --draft=false：删除一个 tag 会把它的 Release 退回 Draft（GitHub 的既有行为），
# 于是「删 tag → 在新提交上重打同名 tag」这类修正动作会让 Release 静默变成草稿，而
# gh release edit 会保留草稿状态、不会把它重新发布。这里显式声明发布态，使重打 tag 能自愈。
name: changelog-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 回退分支要用 git describe 找上一个 tag，浅克隆拿不到。
          fetch-depth: 0

      - name: Generate release notes from CHANGELOG
        run: |
          set -euo pipefail
          bash .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          echo '--- 将写入 Release 的正文 ---'
          cat "$RUNNER_TEMP/notes.md"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --draft=false \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi
