# 打包与发布。与 platform/build.sh 共用同一份构建逻辑（见
# docs/superpowers/specs/2026-09-09-readme-license-and-release-workflow-design.md）。
#
# 触发语义：
#   - 推送 v* tag **自动触发**（正式发版路径）：三个平台的桌面包全部成功后，安装包附到
#     同名 GitHub Release（见下方 release job 的 fail-closed 依赖）。
#   - 也可在 Actions 页面 Run workflow 手动触发，选择要构建的分支或 tag：
#       main / tag v*  → 正式产物（tag v* 另附到 GitHub Release）
#       其他分支       → 桌面测试包（artifact 名带 -test）
#   - **分支 push 依旧不触发**：打包依赖 platform/deploy/lib/dsh-source.sh 等脚本，旧 ref 上
#     不存在，早先的自动 push 触发会在这些 ref 上误触失败。tag 是人主动打的，不适用该顾虑；
#     这也是当初收窄成「仅手动」时唯一要防的场景。
#
# 门禁（typecheck / test / vet / 第一铁律）仍由 ci.yml 负责，本 workflow 只产物。
#
# Action 版本：统一取「首个声明 node24 运行时的主版本」，而不是各自的最新主版本。
# 目标只是消除 GitHub 的 Node 20 弃用告警（Node 20 已从托管 runner 移除），而跨多个
# 主版本升级会引入无从在本地验证的行为变更；这些浮动主版本标签在各自线内仍持续收补丁。
# 两个例外：actions/upload-artifact 首个 node24 是 v6（v5 仍是 node20），
# actions/download-artifact 更晚，v5/v6 都还是 node20，首个 node24 是 v7。
# setup-uv 自 v8 起改为不可变发布、不再维护 vN 浮动标签，所以它的最高可用浮动主版本
# 就是 v7（已 node24）；若要跟到 v10 必须改成固定版本号。Swatinem/rust-cache@v2 与
# dtolnay/rust-toolchain@stable 本身不跑 Node，无需调整。
# 另外 setup-uv 的 `version` 输入钉了精确的 uv 版本 —— 它默认要联网抓版本清单才能开工，
# 属于与构建无关的单点故障，理由见该步骤的注释。

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # 桌面安装包。build.sh 的 build_desktop 要求 target == 宿主平台/架构
  # （native wheel 与 Rust 壳都不可跨架构），所以每个 target 必须有自己的 runner。
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 起基线镜像为 arm64；Intel 走 macos-15-intel（GitHub 最后一个
          # x86_64 镜像，2027-08 退役，届时 Intel 桌面包将无 CI 产出能力）。
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-latest
            target: win-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Checkout upstream dsh
        uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          fetch-depth: 0
          path: deepseek-harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform/desktop

      # cargo install 每次重编译 tauri-cli 约 5 分钟；按 runner 平台缓存已装好的二进制。
      - name: Cache tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin
          key: cargo-tauri-cli-${{ runner.os }}-${{ runner.arch }}

      - name: Install tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          # 必须钉**精确**版本，不能留空、也不能写成范围。setup-uv 在未指定 version 时会走
          # determineVersion → resolveVersion，最终落到 getLatestVersionFromNdjson()：先联网抓
          # raw.githubusercontent.com/astral-sh/versions/main/v1/uv.ndjson，才肯开始装。
          # 该请求与构建毫无关系，却成了单点故障 —— macOS Intel 那台 runner 就因
          # `Error: fetch failed` 卡在第 10 步（另两台同时正常）。
          # 依据源码（v7 src/download/download-version.ts 的 resolveVersion）：显式版本会走
          # `versionInput` 分支，并因 isExplicitVersion() 立即返回，版本解析阶段零网络请求。
          # 注意范围写法（如 `>=0.12`）会命中 resolveVersionSpecifierToLatest，同样触发那次抓取，
          # 所以只有精确版本能真正消除这个依赖。
          version: "0.12.13"
          # 默认 glob 是 `**/uv.lock,**/requirements*.txt`，从仓库根遍历整棵工作区。而
          # platform/desktop/target 下有 pnpm 装出来的插件树（.pnpm 虚拟存储全是软链/联接），
          # Windows 上 stat 这些链接会直接 EPERM 中断本步骤。target/ 里还有历史构建残留的
          # requirements.txt，同样会把遍历引进去。这里改为点名仓库里真正的两个依赖文件：
          # 既绕开 target/，也省掉一次全仓库扫描。
          cache-dependency-glob: |
            deepseek-harness/python/sdk/uv.lock
            platform/upstream/skills/ppt-master/requirements.txt

      # install-components.sh 要求 PPT 解释器可重定位（Homebrew 的 python 链接
      # Cellar 绝对路径，会在打包阶段才失败）。uv 的 standalone Python 是官方推荐路径。
      # 版本跟随开发环境的系统 python3（3.13）。
      - name: Select relocatable Python for the PPT bundle
        shell: bash
        run: |
          uv python install 3.13
          echo "LUMO_PPT_BOOTSTRAP_PYTHON=$(uv python find 3.13)" >> "$GITHUB_ENV"

      - name: Install upstream dsh dependencies
        shell: bash
        run: pnpm --dir deepseek-harness install --frozen-lockfile

      - name: Build desktop package
        shell: bash
        run: ./platform/build.sh --targets ${{ matrix.target }}

      # 非 main、非 tag 的分支产物是测试包，用 -test 后缀区分。
      - name: Compute artifact suffix
        id: suffix
        shell: bash
        run: |
          case "${GITHUB_REF}" in
            refs/heads/main|refs/tags/v*) echo "suffix=" >> "$GITHUB_OUTPUT" ;;
            *) echo "suffix=-test" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload macOS dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: lumo-desktop-${{ matrix.target }}${{ steps.suffix.outputs.suffix }}
          path: platform/desktop/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: lumo-desktop-${{ matrix.target }}${{ steps.suffix.outputs.suffix }}
          path: platform/desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # 只在 tag 上运行：桌面包全部成功后才发布 Release（fail-closed）。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 本 job 只做「取产物 + 发布」，但要读 CHANGELOG.md 与 release-notes.sh 生成正文。
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(
            find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) | sort
          )
          test "${#files[@]}" -gt 0 || { echo "没有可发布的安装包" >&2; exit 1; }
          printf '发布 %s 个文件：\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          # 正文与 changelog-release.yml 同源：都取 CHANGELOG.md 的对应小节，
          # 而不是 GitHub 自动生成的 notes —— 后者在 release 被删后重建时会悄悄替换掉 CHANGELOG。
          bash .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          # 同一 tag 重跑时不因 release 已存在而失败，改为覆盖上传并同步正文。
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${files[@]}"
          fi
