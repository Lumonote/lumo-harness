# 打包与发布。与 platform/build.sh 共用同一份构建逻辑（见
# docs/superpowers/specs/2026-09-09-readme-license-and-release-workflow-design.md）。
#
# 触发语义：
#   - 推送 v* tag **自动触发**（正式发版路径）：桌面包和真实集群验收全部成功后，安装包附到
#     同名 GitHub Release（见下方 release job 的 fail-closed 依赖）。
#   - 推送 **dev** 分支自动触发**测试包**：artifact 名带 -test 后缀，不建 Release、不推镜像。
#     只认 dev 一个分支：打包依赖 platform/deploy/lib/dsh-source.sh 等脚本，旧 ref 上不存在，
#     早先按 `branches: ['**']` 自动触发时会在这些 ref 上误触失败（见
#     docs/superpowers/specs/2026-09-09-readme-license-and-release-workflow-design.md §3.1）。
#     dev 是活动分支，树里这些脚本一定在；其余分支要产物仍走手动触发。
#   - 也可在 Actions 页面 Run workflow 手动触发，选择要构建的分支或 tag：
#       main / tag v*  → 正式产物（tag v* 另附到 GitHub Release）
#       其他分支       → 桌面测试包（artifact 名带 -test）
#
# 基础门禁复用 ci.yml，正式 tag 必须等待基础 CI、完整集群验收与桌面包。
# 桌面包可使用发行证书签名，或明确标识为 unsigned；签名失败不会降级。
#
# Action 版本：统一取「首个声明 node24 运行时的主版本」，而不是各自的最新主版本。
# 目标只是消除 GitHub 的 Node 20 弃用告警（Node 20 已从托管 runner 移除），而跨多个
# 主版本升级会引入无从在本地验证的行为变更；这些浮动主版本标签在各自线内仍持续收补丁。
# 两个例外：actions/upload-artifact 首个 node24 是 v6（v5 仍是 node20），
# actions/download-artifact 更晚，v5/v6 都还是 node20，首个 node24 是 v7。
# setup-uv 自 v8 起改为不可变发布、不再维护 vN 浮动标签，所以它的最高可用浮动主版本
# 就是 v7（已 node24）；若要跟到 v10 必须改成固定版本号。Swatinem/rust-cache@v2 与
# dtolnay/rust-toolchain@stable 本身不跑 Node，无需调整。
# 另外 setup-uv 的 `version` 输入钉了精确的 uv 版本 —— 它默认要联网抓版本清单才能开工，
# 属于与构建无关的单点故障，理由见该步骤的注释。

name: release

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: 'auto: sign when credentials are configured; otherwise build unsigned'
        type: choice
        default: auto
        options:
          - auto
          - signed
          - unsigned
  push:
    branches:
      - dev
    tags:
      - 'v*'

# 同一个 ref 只保留最新一次运行：dev 上连推几个提交时取消仍在跑的旧构建，避免三台
# runner 同时排队（每个桌面产物都是 1.3GB 级）。tag 一律不取消 —— 发版中途被掐掉
# 比排队更糟。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  source-identity:
    runs-on: ubuntu-latest
    outputs:
      upstream-sha: ${{ steps.upstream.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Require formal tag and product versions to agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: node platform/tools/verify-release-version.mjs
      - name: Resolve upstream master once for this release
        id: upstream
        run: node platform/tools/resolve-upstream-ref.mjs

  basic-validation:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: source-identity
    uses: ./.github/workflows/ci.yml
    with:
      upstream_ref: ${{ needs.source-identity.outputs.upstream-sha }}

  cluster-validation:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: source-identity
    uses: ./.github/workflows/cluster-acceptance.yml
    with:
      upstream_ref: ${{ needs.source-identity.outputs.upstream-sha }}
  # 桌面安装包。build.sh 的 build_desktop 要求 target == 宿主平台/架构
  # （native wheel 与 Rust 壳都不可跨架构），所以每个 target 必须有自己的 runner。
  desktop:
    needs: source-identity
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 走 macos-15。原先写的 macos-14 已进入弃用尾声：GitHub 从 2026-07-06
          # 起弃用、2026-11-02 彻底下线，中间安排多轮 brownout（窗口内用该标签的 job
          # 直接失败）。2026-10-31 的 run 41212366668 就撞在 14:00-24:00 UTC 那一轮里，
          # 报「failed because of a scheduled macOS 14 runner image brownout」。
          # 不写 macos-latest：那个浮动标签当前指向 macOS 26，跨大版本升级会在某天
          # 悄悄换掉 Xcode 与系统 SDK，本仓库的口径是显式钉版本。
          # macos-15 是 arm64，-intel 后缀才是 x86_64（macos-15-large 也是 Intel，
          # 名字里带 large 不代表 arm64，别混）。
          - runner: macos-15
            target: darwin-arm64
          # Intel 走 macos-15-intel（GitHub 最后一个 x86_64 镜像，2027-08 退役，
          # 届时 Intel 桌面包将无 CI 产出能力）。
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-latest
            target: win-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Checkout upstream dsh
        uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.source-identity.outputs.upstream-sha }}
          fetch-depth: 0
          path: deepseek-harness

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Select signed or unsigned desktop packaging
        id: signing-mode
        shell: bash
        env:
          LUMO_RELEASE_SIGNING_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode || vars.LUMO_RELEASE_SIGNING_MODE || 'auto' }}
          LUMO_MACOS_SIGNING_P12: ${{ secrets.LUMO_MACOS_SIGNING_P12 }}
          LUMO_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.LUMO_MACOS_SIGNING_P12_PASSWORD }}
          LUMO_MACOS_SIGNING_IDENTITY: ${{ secrets.LUMO_MACOS_SIGNING_IDENTITY }}
          LUMO_MACOS_NOTARY_API_KEY: ${{ secrets.LUMO_MACOS_NOTARY_API_KEY }}
          LUMO_MACOS_NOTARY_KEY_ID: ${{ secrets.LUMO_MACOS_NOTARY_KEY_ID }}
          LUMO_MACOS_NOTARY_ISSUER: ${{ secrets.LUMO_MACOS_NOTARY_ISSUER }}
          LUMO_WINDOWS_SIGNING_PFX: ${{ secrets.LUMO_WINDOWS_SIGNING_PFX }}
          LUMO_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.LUMO_WINDOWS_SIGNING_PFX_PASSWORD }}
          LUMO_WINDOWS_TIMESTAMP_URL: ${{ vars.LUMO_WINDOWS_TIMESTAMP_URL }}
        run: node platform/tools/resolve-release-signing.mjs

      - name: Check all DSH overlay anchors before expensive build setup
        shell: bash
        run: node platform/dsh-overrides/check-compatibility.mjs deepseek-harness

      - name: Read source plugin runtime version
        id: source-plugin-runtime
        shell: bash
        run: echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

      # 只缓存完整构建产物；不同系统/架构/Node/固定源码或构建器不得混用。
      # 即使命中缓存，后续 prepare 仍检查 fingerprint 和必需文件。
      - name: Cache source plugin builds
        uses: actions/cache@v5
        with:
          path: platform/.build/source-plugins
          key: source-plugins-${{ runner.os }}-${{ runner.arch }}-${{ steps.source-plugin-runtime.outputs.node }}-${{ hashFiles('platform/shared/manifests/plugin-baseline.manifest.json', 'platform/tools/prepare-source-plugins.mjs', 'platform/tools/source-plugin-fetch.mjs') }}

      - name: Build unpublished default plugins from pinned sources
        shell: bash
        run: node platform/tools/prepare-source-plugins.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform/desktop

      # cargo install 每次重编译 tauri-cli 约 5 分钟；按 runner 平台缓存已装好的二进制。
      - name: Cache tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin
          key: cargo-tauri-cli-${{ runner.os }}-${{ runner.arch }}

      - name: Install tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0.0" --locked

      # NSIS 由 Tauri 官方下载并校验；与 Cargo 编译缓存分开保存，避免每次构建
      # 都依赖 GitHub Release 下载。useLocalToolsDir 将工具放到 target/.tauri。
      - name: Read Tauri CLI version for the Windows tool cache
        if: runner.os == 'Windows'
        id: tauri-version
        shell: bash
        run: |
          version="$(cargo tauri --version)"
          echo "version=${version#tauri-cli }" >> "$GITHUB_OUTPUT"

      - name: Cache Windows bundler tools
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: platform/desktop/target/.tauri
          key: tauri-bundler-${{ runner.os }}-${{ runner.arch }}-${{ steps.tauri-version.outputs.version }}-v1

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          # 必须钉**精确**版本，不能留空、也不能写成范围。setup-uv 在未指定 version 时会走
          # determineVersion → resolveVersion，最终落到 getLatestVersionFromNdjson()：先联网抓
          # raw.githubusercontent.com/astral-sh/versions/main/v1/uv.ndjson，才肯开始装。
          # 该请求与构建毫无关系，却成了单点故障 —— macOS Intel 那台 runner 就因
          # `Error: fetch failed` 卡在第 10 步（另两台同时正常）。
          # 依据源码（v7 src/download/download-version.ts 的 resolveVersion）：显式版本会走
          # `versionInput` 分支，并因 isExplicitVersion() 立即返回，版本解析阶段零网络请求。
          # 注意范围写法（如 `>=0.12`）会命中 resolveVersionSpecifierToLatest，同样触发那次抓取，
          # 所以只有精确版本能真正消除这个依赖。
          version: "0.12.13"
          # 默认 glob 是 `**/uv.lock,**/requirements*.txt`，从仓库根遍历整棵工作区。而
          # platform/desktop/target 下有 pnpm 装出来的插件树（.pnpm 虚拟存储全是软链/联接），
          # Windows 上 stat 这些链接会直接 EPERM 中断本步骤。target/ 里还有历史构建残留的
          # requirements.txt，同样会把遍历引进去。这里只点名实际依赖输入：
          # 既绕开 target/，也省掉一次全仓库扫描。
          cache-dependency-glob: |
            deepseek-harness/python/sdk/uv.lock
            platform/upstream/skills/ppt-master/requirements.txt
            platform/upstream/ppt-constraints.txt

      # install-components.sh 要求 PPT 解释器可重定位（Homebrew 的 python 链接
      # Cellar 绝对路径，会在打包阶段才失败）。uv 的 standalone Python 是官方推荐路径。
      # 使用 3.13；PPT constraints 固定三种桌面架构均有官方 wheel 的 PyMuPDF。
      - name: Select relocatable Python for the PPT bundle
        shell: bash
        run: |
          uv python install 3.13
          echo "LUMO_PPT_BOOTSTRAP_PYTHON=$(uv python find 3.13)" >> "$GITHUB_ENV"

      - name: Install upstream dsh dependencies
        shell: bash
        run: pnpm --dir deepseek-harness install --frozen-lockfile

      - name: Locate Windows SDK signing tool
        if: runner.os == 'Windows' && steps.signing-mode.outputs.mode == 'signed'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          $path = if ($tool) { $tool.Source } else {
            $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $versions = Get-ChildItem $sdk -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending
            $versions | ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $path) { throw 'Windows SDK signtool.exe is unavailable' }
          "LUMO_WINDOWS_SIGNTOOL=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare release signing credentials
        if: steps.signing-mode.outputs.mode == 'signed'
        shell: bash
        env:
          LUMO_MACOS_SIGNING_P12: ${{ secrets.LUMO_MACOS_SIGNING_P12 }}
          LUMO_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.LUMO_MACOS_SIGNING_P12_PASSWORD }}
          LUMO_MACOS_SIGNING_IDENTITY: ${{ secrets.LUMO_MACOS_SIGNING_IDENTITY }}
          LUMO_MACOS_NOTARY_API_KEY: ${{ secrets.LUMO_MACOS_NOTARY_API_KEY }}
          LUMO_MACOS_NOTARY_KEY_ID: ${{ secrets.LUMO_MACOS_NOTARY_KEY_ID }}
          LUMO_MACOS_NOTARY_ISSUER: ${{ secrets.LUMO_MACOS_NOTARY_ISSUER }}
          LUMO_WINDOWS_SIGNING_PFX: ${{ secrets.LUMO_WINDOWS_SIGNING_PFX }}
          LUMO_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.LUMO_WINDOWS_SIGNING_PFX_PASSWORD }}
          LUMO_WINDOWS_TIMESTAMP_URL: ${{ vars.LUMO_WINDOWS_TIMESTAMP_URL }}
        run: node platform/tools/prepare-release-signing.mjs

      - name: Restore previous runtime size measurement
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/runtime-size-baseline/${{ matrix.target }}.json
          key: runtime-size-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            runtime-size-${{ matrix.target }}-

      - name: Select measured runtime size baseline
        shell: bash
        run: |
          baseline="$RUNNER_TEMP/runtime-size-baseline/${{ matrix.target }}.json"
          if [ -f "$baseline" ]; then
            echo "LUMO_RUNTIME_SIZE_BASELINE=$baseline" >> "$GITHUB_ENV"
          else
            echo 'Runtime size bootstrap: no previous measured baseline; absolute budgets still apply.'
          fi

      - name: Build desktop package
        shell: bash
        env:
          LUMO_RELEASE_SIGNING_REQUIRED: ${{ steps.signing-mode.outputs.required }}
        run: ./platform/build.sh --targets ${{ matrix.target }}

      - name: Prepare next measured runtime size baseline
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-size-baseline"
          cp 'platform/desktop/target/runtime-size/${{ matrix.target }}.json' "$RUNNER_TEMP/runtime-size-baseline/${{ matrix.target }}.json"

      - name: Cache successful runtime size measurement
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/runtime-size-baseline/${{ matrix.target }}.json
          key: runtime-size-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record exact release source identities
        if: always()
        shell: bash
        run: |
          mkdir -p platform/desktop/target/release/source-evidence
          git rev-parse HEAD > platform/desktop/target/release/source-evidence/platform-commit.txt
          git -C deepseek-harness rev-parse HEAD > platform/desktop/target/release/source-evidence/upstream-commit.txt
          test "$(cat platform/desktop/target/release/source-evidence/upstream-commit.txt)" = '${{ needs.source-identity.outputs.upstream-sha }}'

      - name: Preserve runtime size and release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-evidence-${{ matrix.target }}-${{ github.run_id }}
          path: |
            platform/desktop/target/runtime-size/
            platform/desktop/target/release/release-evidence/
            platform/desktop/target/release/source-evidence/
            platform/desktop/target/release/bundle/**/*.release.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary signing credentials
        if: always() && steps.signing-mode.outputs.mode == 'signed'
        shell: bash
        run: node platform/tools/prepare-release-signing.mjs --cleanup

      # 非 main、非 tag 的分支产物是测试包，用 -test 后缀区分。
      - name: Compute artifact suffix
        id: suffix
        shell: bash
        run: |
          signing_suffix=''
          if [ '${{ steps.signing-mode.outputs.mode }}' = 'unsigned' ]; then
            signing_suffix='-unsigned'
          fi
          case "${GITHUB_REF}" in
            refs/heads/main|refs/tags/v*) echo "suffix=$signing_suffix" >> "$GITHUB_OUTPUT" ;;
            *) echo "suffix=$signing_suffix-test" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Upload macOS dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: lumo-desktop-${{ matrix.target }}${{ steps.suffix.outputs.suffix }}
          path: platform/desktop/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          # dev 每次 push 出三份 1.3GB 级产物，默认 90 天会把存储配额吃光。测试包 7 天、
          # 正式产物 30 天足够：Release 本身另存安装包，artifact 只是中间件。
          retention-days: ${{ endsWith(steps.suffix.outputs.suffix, '-test') && 7 || 30 }}

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: lumo-desktop-${{ matrix.target }}${{ steps.suffix.outputs.suffix }}
          path: platform/desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: ${{ endsWith(steps.suffix.outputs.suffix, '-test') && 7 || 30 }}

  # 只在 tag 上运行：桌面包和完整集群验收全部成功后才发布 Release。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [basic-validation, desktop, cluster-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 本 job 只做「取产物 + 发布」，但要读 CHANGELOG.md 与 release-notes.sh 生成正文。
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(
            find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.release.json' \) | sort
          )
          test "${#files[@]}" -gt 0 || { echo "没有可发布的安装包" >&2; exit 1; }
          printf '发布 %s 个文件：\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          # 正文与 changelog-release.yml 同源：都取 CHANGELOG.md 的对应小节，
          # 而不是 GitHub 自动生成的 notes —— 后者在 release 被删后重建时会悄悄替换掉 CHANGELOG。
          bash .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          # 同一 tag 重跑时不因 release 已存在而失败，改为覆盖上传并同步正文。
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --draft=false --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${files[@]}"
          fi
