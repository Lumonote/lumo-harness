name: platform-ci

on:
  push:
    paths:
      - 'platform/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'platform/**'

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Verify upstream dsh tree is pristine (第一铁律)
        run: |
          set -x
          git -C deepseek-harness describe --tags --dirty
          test "$(git -C deepseek-harness describe --tags --dirty)" = "dsh-v0.1.1-rc.2"
          test -z "$(git -C deepseek-harness status --porcelain -uno)"

  deploy-smoke:
    runs-on: ubuntu-latest
    needs: platform
    # compose 冒烟需要 Docker：镜像由阶段 1+ 产出后启用
    if: ${{ false }}

    steps:
      - uses: actions/checkout@v4
      - name: Start minimal Local-lite
        run: docker compose -f platform/deploy/compose.local.yml up -d && docker compose -f platform/deploy/compose.local.yml down
