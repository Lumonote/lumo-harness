name: platform-ci

on:
  push:
    paths:
      - 'platform/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/ci.yml'

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - name: Checkout upstream dsh
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          fetch-depth: 0
          path: deepseek-harness

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Install upstream dsh dependencies
        run: pnpm --dir ../deepseek-harness install --frozen-lockfile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 只装依赖不构建上游 dsh 时，@deepseek-ai/* 的 package.json types 指向的
      # lib/types 不存在，平台 typecheck 会全线 TS2307。上游 master 重构期
      # `pnpm run build` 的 tsdown 主机面是坏的（见 dsh-overrides/prepare-runtime.mjs），
      # 因此按桌面构建链的等价做法：tsc -b 产出 host lib/types，再合成 lib 入口。
      - name: Build upstream dsh host outputs
        run: |
          (cd ../deepseek-harness && node --max-old-space-size=4096 node_modules/typescript/bin/tsc -b tsconfig.host.json)
          node desktop/synthesize-dsh-libs.mjs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Verify upstream dsh tree is pristine (第一铁律)
        run: |
          describe="$(git -C ../deepseek-harness describe --tags --dirty)"
          echo "$describe"
          test "${describe%-dirty}" = "$describe"
          test -z "$(git -C ../deepseek-harness status --porcelain -uno)"

  control-plane-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - collaborator
          - connector-gateway
          - flows
          - governance
          - llm-gateway
          - observability
          - projects
          - registry
          - scheduler
          - usage-ledger
    defaults:
      run:
        working-directory: platform/control-plane/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: 'platform/control-plane/*/go.sum'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  deploy-smoke:
    runs-on: ubuntu-latest
    needs: platform
    # compose 冒烟需要 Docker：镜像由阶段 1+ 产出后启用
    if: ${{ false }}

    steps:
      - uses: actions/checkout@v4
      - name: Start minimal Local-lite
        run: docker compose -f platform/deploy/compose.local.yml up -d && docker compose -f platform/deploy/compose.local.yml down

  production-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Render default chart (mTLS and controls disabled by default)
        run: helm template lumo platform/deploy/helm/lumo-platform >/dev/null
      - name: Render enforced production controls and Istio mTLS
        run: |
          helm template lumo platform/deploy/helm/lumo-platform \
            --set serviceMesh.istio.enabled=true \
            --set serviceMesh.istio.trustDomain=cluster.local \
            --set productionControls.enforced=true \
            --set productionControls.observability.sloDocumentRef=ops/slo.md \
            --set productionControls.observability.collectorUrl=https://otel.example \
            --set productionControls.observability.logsRetentionDays=30 \
            --set productionControls.observability.tracesRetentionDays=30 \
            --set productionControls.observability.monthlyCostCapUSD=1000 \
            --set productionControls.compliance.breakGlassPolicyRef=policy/bg \
            --set productionControls.compliance.tenantKeyDestructionPolicyRef=policy/keys \
            --set productionControls.compliance.marketplaceGovernancePolicyRef=policy/marketplace \
            --set productionControls.observability.enabled=true \
            --set productionControls.observability.lokiUrl=https://loki.example \
            --set productionControls.observability.objectStoreEndpoint=https://s3.example \
            --set productionControls.observability.objectStoreBucket=lumo-traces >/dev/null
      - name: Validate acceptance harness and image tag traceability
        run: |
          bash -n platform/deploy/acceptance-cluster.sh platform/build.sh
          test "$(sed -n 's/^  tag: *\"\?\([^\" ]*\).*/\1/p' platform/deploy/helm/lumo-platform/values.yaml | head -1)" != "latest"
          platform/build.sh --dry-run --targets images --registry ghcr.io/lumonote --version "$(sed -n 's/^  \"version\": \"\([^\"]*\)\".*/\1/p' platform/package.json)" >/dev/null
